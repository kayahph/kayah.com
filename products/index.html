<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Kayah Products</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#F7F3E8;
    color:#17352D;
    min-height:100vh;
}

/* =====================================================
   HEADER
===================================================== */

.header{
    background:#0B4F3A;
    color:white;
    padding:28px 20px 32px;
    border-radius:0 0 32px 32px;
}

.header h1{
    font-size:28px;
    margin-bottom:6px;
}

.header p{
    font-size:14px;
    opacity:.85;
}

/* =====================================================
   CONTAINER
===================================================== */

.container{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:20px 16px 100px;
}

/* =====================================================
   STATUS
===================================================== */

.status{
    background:white;
    border-radius:18px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.status-title{
    font-size:13px;
    color:#777;
    margin-bottom:5px;
}

.status-value{
    font-size:20px;
    font-weight:bold;
    color:#0B4F3A;
}

/* =====================================================
   PLAN CARD
===================================================== */

.plan-card{
    background:#0B4F3A;
    color:white;
    border-radius:22px;
    padding:20px;
    margin-bottom:18px;
}

.plan-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.plan-name{
    font-size:21px;
    font-weight:bold;
}

.plan-badge{
    background:#F2B84B;
    color:#17352D;
    padding:6px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}

.plan-description{
    margin-top:8px;
    font-size:14px;
    opacity:.9;
}

.product-limit{
    margin-top:15px;
    font-size:14px;
}

.progress{
    height:8px;
    background:rgba(255,255,255,.2);
    border-radius:20px;
    margin-top:8px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#F2B84B;
    border-radius:20px;
}

/* =====================================================
   CARD
===================================================== */

.card{
    background:white;
    border-radius:22px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.card h2{
    font-size:19px;
    margin-bottom:16px;
}

/* =====================================================
   FORM
===================================================== */

.form-group{
    margin-bottom:13px;
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
    color:#496058;
}

input,
select{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:12px;
    background:#fff;
    font-size:15px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#16805C;
}

button{
    width:100%;
    border:none;
    border-radius:13px;
    padding:14px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.add-button{
    background:#16805C;
    color:white;
}

.add-button:disabled{
    background:#aaa;
}

/* =====================================================
   PRODUCTS
===================================================== */

.product-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.product{
    border:1px solid #eee;
    border-radius:17px;
    padding:15px;
}

.product-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.product-name{
    font-weight:bold;
    font-size:17px;
}

.product-sku{
    font-size:12px;
    color:#888;
    margin-top:3px;
}

.product-details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:13px;
}

.detail{
    background:#F7F3E8;
    border-radius:10px;
    padding:9px;
}

.detail-label{
    font-size:11px;
    color:#888;
}

.detail-value{
    font-size:14px;
    font-weight:bold;
    margin-top:2px;
}

.delete-button{
    width:auto;
    background:#fff0f0;
    color:#c0392b;
    padding:7px 10px;
    font-size:12px;
}

.empty{
    text-align:center;
    padding:30px 15px;
    color:#888;
}

/* =====================================================
   MESSAGE
===================================================== */

.message{
    display:none;
    padding:13px;
    border-radius:13px;
    margin-bottom:15px;
    font-size:14px;
}

.message.success{
    display:block;
    background:#e8f7ef;
    color:#146c43;
}

.message.error{
    display:block;
    background:#fff0f0;
    color:#a33;
}

/* =====================================================
   LOADING
===================================================== */

.loading{
    text-align:center;
    padding:30px;
    color:#777;
}

/* =====================================================
   USER INFO
===================================================== */

.user-info{
    font-size:12px;
    color:#888;
    margin-top:8px;
    word-break:break-all;
}

</style>

</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <h1>Products</h1>

    <p>
        Manage your products and inventory
    </p>

</div>


<div class="container">

    <!-- MESSAGE -->

    <div id="message"
         class="message">
    </div>


    <!-- ACCOUNT STATUS -->

    <div class="status">

        <div class="status-title">
            Signed in as
        </div>

        <div id="userEmail"
             class="status-value">
            Loading...
        </div>

        <div id="userUid"
             class="user-info">
        </div>

    </div>


    <!-- PLAN -->

    <div class="plan-card">

        <div class="plan-top">

            <div id="planName"
                 class="plan-name">
                Loading plan...
            </div>

            <div id="planBadge"
                 class="plan-badge">
                ...
            </div>

        </div>

        <div id="planDescription"
             class="plan-description">
            Loading...
        </div>

        <div class="product-limit">

            Products:
            <strong>
                <span id="productCount">0</span>
                /
                <span id="productLimit">0</span>
            </strong>

        </div>

        <div class="progress">

            <div id="progressBar"
                 class="progress-bar">
            </div>

        </div>

    </div>


    <!-- ADD PRODUCT -->

    <div class="card">

        <h2>
            Add Product
        </h2>

        <form id="productForm">

            <div class="form-group">

                <label>
                    Product Name
                </label>

                <input
                    type="text"
                    id="productName"
                    placeholder="Example: Shawarma"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    SKU
                </label>

                <input
                    type="text"
                    id="productSku"
                    placeholder="Optional"
                >

            </div>


            <div class="form-group">

                <label>
                    Category
                </label>

                <input
                    type="text"
                    id="productCategory"
                    placeholder="Example: Food"
                >

            </div>


            <div class="form-group">

                <label>
                    Selling Price
                </label>

                <input
                    type="number"
                    id="sellingPrice"
                    placeholder="0.00"
                    min="0"
                    step="0.01"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Cost Price
                </label>

                <input
                    type="number"
                    id="costPrice"
                    placeholder="0.00"
                    min="0"
                    step="0.01"
                >

            </div>


            <div class="form-group">

                <label>
                    Stock Quantity
                </label>

                <input
                    type="number"
                    id="stockQuantity"
                    placeholder="0"
                    min="0"
                    step="1"
                    value="0"
                >

            </div>


            <div class="form-group">

                <label>
                    Low Stock Alert At
                </label>

                <input
                    type="number"
                    id="lowStockThreshold"
                    placeholder="5"
                    min="0"
                    step="1"
                    value="5"
                >

            </div>


            <button
                type="submit"
                id="addButton"
                class="add-button">

                Add Product

            </button>

        </form>

    </div>


    <!-- PRODUCT LIST -->

    <div class="card">

        <h2>
            My Products
        </h2>

        <div id="productList"
             class="product-list">

            <div class="loading">
                Loading products...
            </div>

        </div>

    </div>

</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    doc,
    getDoc,
    getDocs,
    addDoc,
    deleteDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyC_7nSwcfgoUXEe2yo9TJw0cp7XiwGF6w",

    authDomain:
        "kayah-ecosystem.firebaseapp.com",

    projectId:
        "kayah-ecosystem",

    storageBucket:
        "kayah-ecosystem.firebasestorage.app",

    messagingSenderId:
        "49853785143",

    appId:
        "1:49853785143:web:23182e6e11696ac03dcbb2"

};


/* =====================================================
   SAME INITIALIZATION AS DASHBOARD
===================================================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =====================================================
   PLAN CONFIG
===================================================== */

const PLAN_CONFIG = {

    free:{
        name:"Free Plan",
        badge:"FREE",
        limit:30,
        description:"Up to 30 products"
    },

    trial:{
        name:"30-Day Free Trial",
        badge:"30-DAY TRIAL",
        limit:100,
        description:"Up to 100 products"
    },

    starter:{
        name:"Starter Plan",
        badge:"STARTER",
        limit:100,
        description:"Up to 100 products"
    },

    business:{
        name:"Business Plan",
        badge:"BUSINESS",
        limit:500,
        description:"Up to 500 products"
    },

    pro:{
        name:"Pro Plan",
        badge:"PRO",
        limit:Infinity,
        description:"Unlimited products"
    }

};


/* =====================================================
   ELEMENTS
===================================================== */

const userEmail =
    document.getElementById("userEmail");

const userUid =
    document.getElementById("userUid");

const planName =
    document.getElementById("planName");

const planBadge =
    document.getElementById("planBadge");

const planDescription =
    document.getElementById("planDescription");

const productCount =
    document.getElementById("productCount");

const productLimit =
    document.getElementById("productLimit");

const progressBar =
    document.getElementById("progressBar");

const productList =
    document.getElementById("productList");

const productForm =
    document.getElementById("productForm");

const addButton =
    document.getElementById("addButton");

const message =
    document.getElementById("message");


/* =====================================================
   GLOBAL STATE
===================================================== */

let currentUser = null;

let currentUserData = null;

let currentPlan = "free";

let currentProducts = [];


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type = "success"
){

    message.textContent = text;

    message.className =
        "message " + type;

}


/* =====================================================
   EFFECTIVE PLAN
===================================================== */

function getEffectivePlan(data){

    const plan =
        data?.plan || "free";


    /*
       PAID PLANS
    */

    if(
        plan === "starter" ||
        plan === "business" ||
        plan === "pro"
    ){

        return plan;

    }


    /*
       FREE + ACTIVE TRIAL
    */

    if(
        plan === "free" &&
        data?.trialActive === true
    ){

        let ends =
            data.trialEndsAt;


        if(
            ends &&
            typeof ends.toDate === "function"
        ){

            ends = ends.toDate();

        }

        else if(ends){

            ends = new Date(ends);

        }


        if(
            ends &&
            ends.getTime() > Date.now()
        ){

            return "trial";

        }

    }


    return "free";

}


/* =====================================================
   UPDATE PLAN DISPLAY
===================================================== */

function updatePlanDisplay(){

    const config =
        PLAN_CONFIG[currentPlan];


    planName.textContent =
        config.name;

    planBadge.textContent =
        config.badge;

    planDescription.textContent =
        config.description;


    if(
        config.limit === Infinity
    ){

        productLimit.textContent =
            "∞";

    }

    else{

        productLimit.textContent =
            config.limit;

    }


    updateProductCount();

}


/* =====================================================
   PRODUCT COUNT
===================================================== */

function updateProductCount(){

    const count =
        currentProducts.length;

    const config =
        PLAN_CONFIG[currentPlan];


    productCount.textContent =
        count;


    if(
        config.limit === Infinity
    ){

        progressBar.style.width =
            "10%";

    }

    else{

        let percentage =
            (count / config.limit) * 100;

        percentage =
            Math.min(
                percentage,
                100
            );

        progressBar.style.width =
            percentage + "%";

    }


    /*
       DISABLE ADD BUTTON
       WHEN LIMIT IS REACHED
    */

    if(
        config.limit !== Infinity &&
        count >= config.limit
    ){

        addButton.disabled = true;

        addButton.textContent =
            "Product Limit Reached";

    }

    else{

        addButton.disabled = false;

        addButton.textContent =
            "Add Product";

    }

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

    if(!currentUser){

        return;

    }


    productList.innerHTML =

        '<div class="loading">Loading products...</div>';


    try{

        const productsRef =
            collection(
                db,
                "users",
                currentUser.uid,
                "products"
            );


        const snapshot =
            await getDocs(productsRef);


        currentProducts = [];


        snapshot.forEach(function(item){

            currentProducts.push({

                id:item.id,

                ...item.data()

            });

        });


        /*
           NEWEST FIRST
        */

        currentProducts.sort(function(a,b){

            const aTime =
                a.createdAt?.toMillis
                    ? a.createdAt.toMillis()
                    : 0;

            const bTime =
                b.createdAt?.toMillis
                    ? b.createdAt.toMillis()
                    : 0;

            return bTime - aTime;

        });


        renderProducts();

        updateProductCount();

    }

    catch(error){

        console.error(
            "Products loading error:",
            error
        );


        productList.innerHTML =
            '<div class="empty">Unable to load products.</div>';


        showMessage(
            "Could not load your products. Please check your Firestore rules.",
            "error"
        );

    }

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(){

    if(
        currentProducts.length === 0
    ){

        productList.innerHTML =

            '<div class="empty">' +

            'No products yet.<br>' +

            'Add your first product above.' +

            '</div>';

        return;

    }


    productList.innerHTML = "";


    currentProducts.forEach(function(product){

        const item =
            document.createElement("div");

        item.className =
            "product";


        const sellingPrice =
            Number(
                product.sellingPrice || 0
            ).toFixed(2);


        const costPrice =
            Number(
                product.costPrice || 0
            ).toFixed(2);


        const stock =
            Number(
                product.stockQuantity || 0
            );


        item.innerHTML =

            '<div class="product-top">' +

                '<div>' +

                    '<div class="product-name">' +

                        escapeHtml(
                            product.name ||
                            "Unnamed Product"
                        ) +

                    '</div>' +

                    '<div class="product-sku">' +

                        escapeHtml(
                            product.sku ||
                            "No SKU"
                        ) +

                    '</div>' +

                '</div>' +

                '<button class="delete-button">' +

                    'Delete' +

                '</button>' +

            '</div>' +


            '<div class="product-details">' +

                '<div class="detail">' +

                    '<div class="detail-label">' +
                        'Category' +
                    '</div>' +

                    '<div class="detail-value">' +

                        escapeHtml(
                            product.category ||
                            "Uncategorized"
                        ) +

                    '</div>' +

                '</div>' +


                '<div class="detail">' +

                    '<div class="detail-label">' +
                        'Selling Price' +
                    '</div>' +

                    '<div class="detail-value">' +

                        '₱' +
                        sellingPrice +

                    '</div>' +

                '</div>' +


                '<div class="detail">' +

                    '<div class="detail-label">' +
                        'Cost Price' +
                    '</div>' +

                    '<div class="detail-value">' +

                        '₱' +
                        costPrice +

                    '</div>' +

                '</div>' +


                '<div class="detail">' +

                    '<div class="detail-label">' +
                        'Stock' +
                    '</div>' +

                    '<div class="detail-value">' +

                        stock +

                    '</div>' +

                '</div>' +

            '</div>';


        const deleteButton =
            item.querySelector(
                ".delete-button"
            );


        deleteButton.addEventListener(
            "click",
            function(){

                deleteProduct(
                    product.id,
                    product.name
                );

            }
        );


        productList.appendChild(item);

    });

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   ADD PRODUCT
===================================================== */

productForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        if(!currentUser){

            showMessage(
                "No signed-in user was found.",
                "error"
            );

            return;

        }


        const config =
            PLAN_CONFIG[currentPlan];


        /*
           CHECK LIMIT
        */

        if(
            config.limit !== Infinity &&
            currentProducts.length >= config.limit
        ){

            showMessage(
                "You have reached the product limit for your current plan.",
                "error"
            );

            return;

        }


        const name =
            document
                .getElementById("productName")
                .value
                .trim();


        const sku =
            document
                .getElementById("productSku")
                .value
                .trim();


        const category =
            document
                .getElementById("productCategory")
                .value
                .trim();


        const sellingPrice =
            Number(
                document
                    .getElementById("sellingPrice")
                    .value || 0
            );


        const costPrice =
            Number(
                document
                    .getElementById("costPrice")
                    .value || 0
            );


        const stockQuantity =
            Number(
                document
                    .getElementById("stockQuantity")
                    .value || 0
            );


        const lowStockThreshold =
            Number(
                document
                    .getElementById("lowStockThreshold")
                    .value || 5
            );


        if(!name){

            showMessage(
                "Please enter a product name.",
                "error"
            );

            return;

        }


        addButton.disabled = true;

        addButton.textContent =
            "Saving...";


        try{

            const productsRef =
                collection(
                    db,
                    "users",
                    currentUser.uid,
                    "products"
                );


            await addDoc(
                productsRef,
                {

                    uid:
                        currentUser.uid,

                    name:
                        name,

                    sku:
                        sku,

                    category:
                        category,

                    sellingPrice:
                        sellingPrice,

                    costPrice:
                        costPrice,

                    stockQuantity:
                        stockQuantity,

                    lowStockThreshold:
                        lowStockThreshold,

                    createdAt:
                        serverTimestamp(),

                    updatedAt:
                        serverTimestamp()

                }
            );


            productForm.reset();


            document
                .getElementById(
                    "stockQuantity"
                )
                .value = "0";


            document
                .getElementById(
                    "lowStockThreshold"
                )
                .value = "5";


            showMessage(
                "Product added successfully.",
                "success"
            );


            await loadProducts();

        }

        catch(error){

            console.error(
                "Add product error:",
                error
            );


            showMessage(
                "Could not add the product. Please check your Firestore rules.",
                "error"
            );

        }

        finally{

            updateProductCount();

        }

    }
);


/* =====================================================
   DELETE PRODUCT
===================================================== */

async function deleteProduct(
    productId,
    productName
){

    if(!currentUser){

        return;

    }


    const confirmed =
        confirm(
            "Delete " +
            productName +
            "?"
        );


    if(!confirmed){

        return;

    }


    try{

        await deleteDoc(

            doc(
                db,
                "users",
                currentUser.uid,
                "products",
                productId
            )

        );


        showMessage(
            "Product deleted.",
            "success"
        );


        await loadProducts();

    }

    catch(error){

        console.error(
            "Delete product error:",
            error
        );


        showMessage(
            "Could not delete the product.",
            "error"
        );

    }

}


/* =====================================================
   SAME AUTH PATTERN AS DASHBOARD
===================================================== */

onAuthStateChanged(
    auth,
    async function(user){

        /*
           NOT LOGGED IN
        */

        if(!user){

            userEmail.textContent =
                "No signed-in user";

            userUid.textContent =
                "";

            showMessage(
                "No signed-in Firebase user was found. Please sign in first.",
                "error"
            );

            return;

        }


        /*
           SAVE CURRENT USER
        */

        currentUser =
            user;


        userEmail.textContent =
            user.email ||
            "Email not available";


        userUid.textContent =
            "Firebase UID: " +
            user.uid;


        try{

            console.log(
                "Kayah Products UID:",
                user.uid
            );


            /*
               USER DOCUMENT
            */

            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const userSnapshot =
                await getDoc(
                    userRef
                );


            /*
               USER DOCUMENT MISSING
            */

            if(
                !userSnapshot.exists()
            ){

                showMessage(
                    "Your Kayah user profile was not found in Firestore.",
                    "error"
                );

                return;

            }


            /*
               USER DATA
            */

            currentUserData =
                userSnapshot.data();


            console.log(
                "Kayah user profile:",
                currentUserData
            );


            /*
               DETERMINE PLAN
            */

            currentPlan =
                getEffectivePlan(
                    currentUserData
                );


            console.log(
                "Effective Kayah plan:",
                currentPlan
            );


            /*
               DISPLAY PLAN
            */

            updatePlanDisplay();


            /*
               LOAD PRODUCTS
            */

            await loadProducts();


            console.log(
                "Kayah Products loaded successfully."
            );

        }

        catch(error){

            console.error(
                "Kayah Products error:",
                error
            );


            if(
                error.code ===
                "permission-denied"
            ){

                showMessage(
                    "Firebase denied access to your account or products. Check your Firestore rules.",
                    "error"
                );

            }

            else{

                showMessage(
                    "Something went wrong while loading your Kayah account.",
                    "error"
                );

            }

        }

    }
);

</script>

</body>

</html>
