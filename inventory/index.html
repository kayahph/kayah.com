
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B4F3A">
<title>Inventory - Kayah</title>

<style>
:root {
  --green: #0B4F3A;
  --green-light: #16805C;
  --yellow: #F2B84B;
  --cream: #F7F3E8;
  --text: #18352C;
  --muted: #788A82;
  --border: #E3E9E3;
  --white: #FFFFFF;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html { scroll-behavior: smooth; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    Roboto, Arial, sans-serif;
  background: var(--cream);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}

/* HEADER */

.header {
  background: var(--green);
  color: white;
  padding: calc(12px + env(safe-area-inset-top)) 14px 13px;
  border-radius: 0 0 17px 17px;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.back-button {
  width: 36px;
  height: 36px;
  flex: none;
  border: 0;
  border-radius: 11px;
  background: rgba(255,255,255,.13);
  color: white;
  font-size: 24px;
  cursor: pointer;
}

.header-title {
  font-size: 19px;
  font-weight: 800;
  line-height: 1.2;
}

.header-subtitle {
  margin-top: 3px;
  color: rgba(255,255,255,.75);
  font-size: 11px;
}

.header-icon {
  width: 36px;
  height: 36px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: var(--yellow);
  font-size: 19px;
}

.records-button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  margin-top: 11px;
  padding: 10px 12px;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 10px;
  background: rgba(255,255,255,.11);
  color: white;
  font-size: 12px;
  font-weight: 800;
  text-decoration: none;
  transition: background .2s;
}

.records-button:active {
  background: rgba(255,255,255,.2);
}

/* PAGE */

.page {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 12px 12px 22px;
}

.loading {
  min-height: 180px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: var(--muted);
  font-size: 13px;
}

.spinner {
  width: 30px;
  height: 30px;
  border: 3px solid #DDE8E2;
  border-top-color: var(--green-light);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.error-box {
  display: none;
  margin-bottom: 12px;
  padding: 12px;
  border: 1px solid #F1CACA;
  border-radius: 11px;
  background: #FFF0F0;
  color: #A12B2B;
  font-size: 12px;
  overflow-wrap: anywhere;
}

/* COMPACT SUMMARY */

.summary-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 15px;
}

.summary-card {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 11px 10px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 13px;
  box-shadow: 0 2px 8px rgba(11,79,58,.035);
}

.summary-icon {
  width: 34px;
  height: 34px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: #EAF2ED;
  font-size: 16px;
}

.summary-card:nth-child(3) .summary-icon {
  background: #FFF3D8;
}

.summary-card:nth-child(4) .summary-icon {
  background: #FFE9E9;
}

.summary-info { min-width: 0; }

.summary-label {
  color: var(--muted);
  font-size: 10px;
  font-weight: 600;
  line-height: 1.3;
}

.summary-value {
  margin-top: 3px;
  color: var(--green);
  font-size: 21px;
  font-weight: 800;
  line-height: 1.1;
}

/* SEARCH AND FILTERS */

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 9px;
}

.section-title {
  color: var(--green);
  font-size: 15px;
  font-weight: 800;
}

.result-count {
  color: var(--muted);
  font-size: 10px;
  white-space: nowrap;
}

.search-box {
  position: relative;
  margin-bottom: 10px;
}

.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 15px;
  pointer-events: none;
}

.search-box input {
  width: 100%;
  padding: 11px 12px 11px 36px;
  border: 1px solid var(--border);
  border-radius: 11px;
  outline: none;
  background: white;
  color: var(--text);
  font-size: 13px;
}

.search-box input:focus,
.stock-input:focus,
.reason-input:focus {
  border-color: var(--green-light);
}

.filters {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  margin-bottom: 12px;
  padding-bottom: 2px;
  scrollbar-width: none;
}

.filters::-webkit-scrollbar { display: none; }

.filter-btn {
  flex: none;
  padding: 7px 11px;
  border: 1px solid #DDE5DE;
  border-radius: 18px;
  background: white;
  color: #557067;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
}

.filter-btn.active {
  background: var(--green);
  border-color: var(--green);
  color: white;
}

/* COMPACT PRODUCT LIST */

.inventory-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.inventory-card {
  padding: 10px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 13px;
  box-shadow: 0 2px 7px rgba(11,79,58,.035);
}

.product-row {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
}

.product-image {
  width: 45px;
  height: 45px;
  flex: none;
  display: grid;
  place-items: center;
  overflow: hidden;
  border-radius: 10px;
  background: #EAF2ED;
  color: var(--green);
  font-size: 21px;
}

.product-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.product-info {
  min-width: 0;
  flex: 1;
}

.product-name {
  overflow: hidden;
  color: var(--text);
  font-size: 13px;
  font-weight: 800;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.product-sku {
  margin-top: 3px;
  overflow: hidden;
  color: #899991;
  font-size: 10px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.stock-status {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 5px;
  padding: 3px 7px;
  border-radius: 12px;
  font-size: 9px;
  font-weight: 800;
}

.status-in {
  background: #E5F5EC;
  color: #16805C;
}

.status-low {
  background: #FFF4D9;
  color: #A56A00;
}

.status-out {
  background: #FFE8E8;
  color: #B52B2B;
}

.stock-summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px solid #EEF1EE;
}

.stock-number {
  min-width: 0;
}

.stock-label {
  color: var(--muted);
  font-size: 10px;
}

.stock-value {
  margin-top: 2px;
  color: var(--green);
  font-size: 17px;
  font-weight: 800;
  line-height: 1.2;
  overflow-wrap: anywhere;
}

.stock-unit {
  color: var(--muted);
  font-size: 10px;
  font-weight: 600;
}

.adjust-button {
  flex: none;
  padding: 8px 11px;
  border: 0;
  border-radius: 9px;
  background: var(--green-light);
  color: white;
  font-size: 11px;
  font-weight: 800;
  cursor: pointer;
}

.adjust-button:active { transform: scale(.97); }

/* EMPTY STATE */

.empty {
  padding: 25px 15px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: white;
  text-align: center;
}

.empty-icon { font-size: 30px; }

.empty-title {
  margin-top: 7px;
  color: var(--green);
  font-size: 14px;
  font-weight: 800;
}

.empty-text {
  margin-top: 5px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
}

/* STOCK MODAL */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  align-items: flex-end;
  justify-content: center;
  padding: 12px;
  background: rgba(0,0,0,.48);
}

.modal.show { display: flex; }

.modal-box {
  width: 100%;
  max-width: 440px;
  padding: 18px;
  border-radius: 20px;
  background: var(--cream);
  box-shadow: 0 15px 45px rgba(0,0,0,.2);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 13px;
}

.modal-title {
  color: var(--green);
  font-size: 17px;
  font-weight: 800;
}

.close-button {
  width: 32px;
  height: 32px;
  border: 0;
  border-radius: 50%;
  background: #E7ECE8;
  color: #426057;
  font-size: 20px;
  cursor: pointer;
}

.modal-product {
  margin-bottom: 14px;
  padding: 11px;
  border-radius: 11px;
  background: white;
}

.modal-product-name {
  font-size: 13px;
  font-weight: 800;
}

.modal-current {
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: #50675E;
  font-size: 11px;
  font-weight: 800;
}

.stock-input,
.reason-input {
  width: 100%;
  padding: 12px;
  border: 1px solid #D8E0DA;
  border-radius: 11px;
  outline: none;
  background: white;
  color: var(--text);
  font-size: 14px;
}

.stock-input { font-weight: 700; }

.reason-input {
  margin-top: 12px;
  resize: vertical;
  font-family: inherit;
  font-size: 12px;
}

.modal-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 14px;
}

.cancel-button,
.save-button {
  padding: 12px;
  border: 0;
  border-radius: 11px;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
}

.cancel-button {
  background: #E5EBE7;
  color: #456158;
}

.save-button {
  background: var(--green);
  color: white;
}

.save-button:disabled {
  opacity: .6;
  cursor: wait;
}

/* TOAST */

.toast {
  position: fixed;
  z-index: 200;
  left: 50%;
  bottom: calc(82px + env(safe-area-inset-bottom));
  max-width: calc(100% - 30px);
  padding: 10px 14px;
  border-radius: 10px;
  background: var(--green);
  color: white;
  font-size: 12px;
  font-weight: 700;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 10px);
  transition: .2s ease;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* BOTTOM NAV */

.bottom-nav {
  position: fixed;
  z-index: 50;
  right: 0;
  bottom: 0;
  left: 0;
  height: calc(65px + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  border-top: 1px solid #E3E8E4;
  background: white;
  box-shadow: 0 -3px 12px rgba(11,79,58,.05);
}

.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-around;
  width: 100%;
  max-width: 700px;
  height: 100%;
  margin: 0 auto;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  min-width: 0;
  padding: 6px 10px;
  border-radius: 10px;
  color: #7A8B84;
  font-size: 9px;
  font-weight: 700;
  text-decoration: none;
}

.nav-icon { font-size: 18px; }

.nav-item.active { color: var(--green); }

@media (min-width: 700px) {
  .header { padding-left: max(18px, calc((100% - 860px)/2)); padding-right: max(18px, calc((100% - 860px)/2)); }
  .records-button { width: auto; margin-left: auto; margin-top: 12px; padding: 9px 14px; }
  .summary-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .modal { align-items: center; }
  .page { padding-top: 16px; }
  .inventory-list { gap: 8px; }
}

@media (max-width: 360px) {
  .page { padding-right: 9px; padding-left: 9px; }
  .summary-card { gap: 7px; padding: 9px 7px; }
  .summary-icon { width: 29px; height: 29px; font-size: 14px; }
  .summary-value { font-size: 19px; }
  .product-image { width: 40px; height: 40px; }
  .adjust-button { padding: 8px; font-size: 10px; }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-top">
    <div class="header-left">
      <button class="back-button" type="button" onclick="goBack()" aria-label="Go back">‹</button>
      <div>
        <div class="header-title">Inventory</div>
        <div class="header-subtitle">Manage your product stock</div>
      </div>
    </div>
    <div class="header-icon">📦</div>
  </div>

  <a class="records-button" href="../inventory-record/index.html">
    📋 &nbsp; Inventory Records &nbsp; →
  </a>
</header>

<main class="page">
  <div class="loading" id="loadingScreen">
    <div class="spinner"></div>
    <div>Loading inventory...</div>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div id="inventoryContent" style="display:none">

    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-icon">📦</div>
        <div class="summary-info">
          <div class="summary-label">Tracked Products</div>
          <div class="summary-value" id="totalCount">0</div>
        </div>
      </div>

      <div class="summary-card">
        <div class="summary-icon">🟢</div>
        <div class="summary-info">
          <div class="summary-label">In Stock</div>
          <div class="summary-value" id="inStockCount">0</div>
        </div>
      </div>

      <div class="summary-card">
        <div class="summary-icon">🟠</div>
        <div class="summary-info">
          <div class="summary-label">Low Stock</div>
          <div class="summary-value" id="lowStockCount">0</div>
        </div>
      </div>

      <div class="summary-card">
        <div class="summary-icon">🔴</div>
        <div class="summary-info">
          <div class="summary-label">Out of Stock</div>
          <div class="summary-value" id="outStockCount">0</div>
        </div>
      </div>
    </div>

    <div class="section-heading">
      <div class="section-title">Product Inventory</div>
      <div class="result-count" id="resultCount">0 products</div>
    </div>

    <div class="search-box">
      <span class="search-icon">🔎</span>
      <input
        type="search"
        id="searchInput"
        placeholder="Search product or SKU..."
        autocomplete="off"
        aria-label="Search products">
    </div>

    <div class="filters">
      <button type="button" class="filter-btn active" data-filter="all">All</button>
      <button type="button" class="filter-btn" data-filter="in">In Stock</button>
      <button type="button" class="filter-btn" data-filter="low">Low Stock</button>
      <button type="button" class="filter-btn" data-filter="out">Out of Stock</button>
    </div>

    <div class="inventory-list" id="inventoryList"></div>
  </div>
</main>

<!-- ADJUST STOCK MODAL -->
<div class="modal" id="stockModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">Add Stock</div>
      <button class="close-button" type="button" onclick="closeStockModal()" aria-label="Close">×</button>
    </div>

    <div class="modal-product">
      <div class="modal-product-name" id="modalProductName">Product</div>
      <div class="modal-current" id="modalCurrentStock">Current stock: 0</div>
    </div>

    <label class="form-label" for="stockQuantityInput">Quantity to Add</label>
    <input
      class="stock-input"
      id="stockQuantityInput"
      type="number"
      min="0"
      step="any"
      inputmode="decimal"
      placeholder="Enter quantity">

    <label class="form-label" for="stockReasonInput" style="margin-top:13px">
      Reason (optional)
    </label>
    <textarea
      class="reason-input"
      id="stockReasonInput"
      rows="2"
      placeholder="Example: New stock received"></textarea>

    <div class="modal-buttons">
      <button class="cancel-button" type="button" onclick="closeStockModal()">Cancel</button>
      <button class="save-button" type="button" id="saveStockButton" onclick="saveStockAdjustment()">Add Stock</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<nav class="bottom-nav">
  <div class="nav-inner">
    <a href="../dashboard/" class="nav-item">
      <span class="nav-icon">🏠</span>Home
    </a>
    <a href="../products/" class="nav-item">
      <span class="nav-icon">📦</span>Products
    </a>
    <a href="../inventory/" class="nav-item active">
      <span class="nav-icon">📊</span>Inventory
    </a>
    <a href="../sales/" class="nav-item">
      <span class="nav-icon">💰</span>Sales
    </a>
    <a href="../settings/" class="nav-item">
      <span class="nav-icon">⚙️</span>Settings
    </a>
  </div>
</nav>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc,
  updateDoc,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyC_7nSwcfgoUXEEe2yo9TJw0cp7XiwGF6w",
  authDomain: "kayah-ecosystem.firebaseapp.com",
  projectId: "kayah-ecosystem",
  storageBucket: "kayah-ecosystem.firebasestorage.app",
  messagingSenderId: "49853785143",
  appId: "1:49853785143:web:23182e6e11696ac03dcbb2"
};

/* INITIALIZE FIREBASE */
const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* STATE */
let currentUser = null;
let currentUserData = null;
let currentUserRole = "owner";
let products = [];
let currentFilter = "all";
let selectedProduct = null;
let toastTimer = null;

/* DOM */
const loadingScreen = document.getElementById("loadingScreen");
const inventoryContent = document.getElementById("inventoryContent");
const errorBox = document.getElementById("errorBox");
const inventoryList = document.getElementById("inventoryList");
const searchInput = document.getElementById("searchInput");
const stockModal = document.getElementById("stockModal");
const saveStockButton = document.getElementById("saveStockButton");

/* HELPERS */
function escapeHTML(value) {
  if (value === null || value === undefined) return "";
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function formatNumber(value) {
  const number = Number(value);
  if (!Number.isFinite(number)) return "0";
  return number.toLocaleString(undefined, { maximumFractionDigits: 2 });
}

function getStockValue(product) {
  if (
    product.stockQuantity === null ||
    product.stockQuantity === undefined ||
    product.stockQuantity === ""
  ) return 0;

  const value = Number(product.stockQuantity);
  return Number.isFinite(value) ? value : 0;
}

function getLowStockValue(product) {
  if (
    product.lowStockAlert === null ||
    product.lowStockAlert === undefined ||
    product.lowStockAlert === ""
  ) return 0;

  const value = Number(product.lowStockAlert);
  return Number.isFinite(value) ? value : 0;
}

/* STOCK STATUS */
function getStockStatus(product) {
  const stock = getStockValue(product);
  const low = getLowStockValue(product);

  if (stock <= 0) {
    return { type: "out", label: "Out of Stock" };
  }

  if (low > 0 && stock <= low) {
    return { type: "low", label: "Low Stock" };
  }

  return { type: "in", label: "In Stock" };
}

/* ACTIVITY LOG */
async function logActivity({
  action,
  description,
  targetType,
  targetId,
  details = {}
}) {
  if (!currentUser) return;

  try {
    const activityRef = collection(
      db,
      "users",
      currentUser.uid,
      "activityLogs"
    );

    await addDoc(activityRef, {
      action,
      description,
      targetType,
      targetId,
      performedByUid: currentUser.uid,
      performedByName:
        currentUserData?.fullName ||
        currentUserData?.name ||
        currentUser.displayName ||
        currentUser.email ||
        "Unknown User",
      performedByRole: currentUserRole,
      details,
      createdAt: serverTimestamp()
    });
  } catch (error) {
    // Keep the stock update from failing if logging fails.
    console.error("ACTIVITY LOG ERROR:", error);
  }
}

/* LOAD PRODUCTS */
async function loadInventory() {
  try {
    const productsRef = collection(
      db,
      "users",
      currentUser.uid,
      "products"
    );

    const snapshot = await getDocs(productsRef);
    products = [];

    snapshot.forEach((productDoc) => {
      const product = productDoc.data();

      if (product.trackStock === true) {
        products.push({
          id: productDoc.id,
          ...product
        });
      }
    });

    updateSummary();
    renderProducts();

    loadingScreen.style.display = "none";
    inventoryContent.style.display = "block";
    errorBox.style.display = "none";
  } catch (error) {
    console.error("Inventory loading error:", error);

    loadingScreen.style.display = "none";
    errorBox.style.display = "block";
    errorBox.innerHTML =
      "<strong>Unable to load inventory.</strong><br>" +
      escapeHTML(error.message || "Please try again.");
  }
}

/* SUMMARY */
function updateSummary() {
  let inStock = 0;
  let lowStock = 0;
  let outStock = 0;

  products.forEach((product) => {
    const status = getStockStatus(product);

    if (status.type === "in") inStock++;
    else if (status.type === "low") lowStock++;
    else outStock++;
  });

  document.getElementById("totalCount").textContent = products.length;
  document.getElementById("inStockCount").textContent = inStock;
  document.getElementById("lowStockCount").textContent = lowStock;
  document.getElementById("outStockCount").textContent = outStock;
}

/* FILTER PRODUCTS */
function getFilteredProducts() {
  const search = searchInput.value.trim().toLowerCase();

  return products.filter((product) => {
    const name = String(product.name || "").toLowerCase();
    const sku = String(product.sku || "").toLowerCase();

    const matchesSearch =
      !search || name.includes(search) || sku.includes(search);

    if (!matchesSearch) return false;
    if (currentFilter === "all") return true;

    return getStockStatus(product).type === currentFilter;
  });
}

/* RENDER PRODUCTS */
function renderProducts() {
  const filtered = getFilteredProducts();

  inventoryList.innerHTML = "";
  document.getElementById("resultCount").textContent =
    `${filtered.length} ${filtered.length === 1 ? "product" : "products"}`;

  if (filtered.length === 0) {
    const message = products.length === 0
      ? "Products with Track Stock enabled will appear here."
      : "No products match your search or filter.";

    inventoryList.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📦</div>
        <div class="empty-title">No inventory found</div>
        <div class="empty-text">${escapeHTML(message)}</div>
      </div>
    `;
    return;
  }

  filtered.forEach((product) => {
    const status = getStockStatus(product);
    const stock = getStockValue(product);
    const unit = product.unit || "units";
    const name = product.name || "Unnamed Product";

    const card = document.createElement("div");
    card.className = "inventory-card";

    const imageHTML = product.photoUrl
      ? `<img src="${escapeHTML(product.photoUrl)}"
          alt="${escapeHTML(name)}"
          loading="lazy">`
      : "📦";

    card.innerHTML = `
      <div class="product-row">
        <div class="product-image">${imageHTML}</div>

        <div class="product-info">
          <div class="product-name" title="${escapeHTML(name)}">
            ${escapeHTML(name)}
          </div>

          <div class="product-sku">
            ${product.sku
              ? `SKU: ${escapeHTML(product.sku)}`
              : "No SKU"}
          </div>

          <div class="stock-status status-${status.type}">
            ● ${status.label}
          </div>
        </div>
      </div>

      <div class="stock-summary">
        <div class="stock-number">
          <div class="stock-label">Current Stock</div>
          <div class="stock-value">
            ${formatNumber(stock)}
            <span class="stock-unit">${escapeHTML(unit)}</span>
          </div>
        </div>

        <button type="button" class="adjust-button">
          + Add Stock
        </button>
      </div>
    `;

    const image = card.querySelector(".product-image img");
    if (image) {
      image.addEventListener("error", () => {
        card.querySelector(".product-image").textContent = "📦";
      }, { once: true });
    }

    card.querySelector(".adjust-button").addEventListener("click", () => {
      openStockModal(product.id);
    });

    inventoryList.appendChild(card);
  });
}

/* OPEN STOCK MODAL */
window.openStockModal = function(productId) {
  const product = products.find((item) => item.id === productId);
  if (!product) return;

  selectedProduct = product;

  document.getElementById("modalProductName").textContent =
    product.name || "Product";

  document.getElementById("modalCurrentStock").textContent =
    `Current stock: ${formatNumber(getStockValue(product))} ${product.unit || "units"}`;

  document.getElementById("stockQuantityInput").value = "";
  document.getElementById("stockReasonInput").value = "";
  saveStockButton.disabled = false;
  saveStockButton.textContent = "Add Stock";

  stockModal.classList.add("show");

  setTimeout(() => {
    document.getElementById("stockQuantityInput").focus();
  }, 100);
};

/* CLOSE MODAL */
window.closeStockModal = function() {
  stockModal.classList.remove("show");
  selectedProduct = null;
};

stockModal.addEventListener("click", (event) => {
  if (event.target === stockModal) closeStockModal();
});

/* SAVE STOCK */
window.saveStockAdjustment = async function() {
  if (!selectedProduct || !currentUser) return;

  const input = document.getElementById("stockQuantityInput");
  const reason = document.getElementById("stockReasonInput").value.trim();
  const quantityToAdd = Number(input.value);

  if (
    input.value.trim() === "" ||
    !Number.isFinite(quantityToAdd) ||
    quantityToAdd <= 0
  ) {
    showToast("Please enter a quantity greater than zero.");
    input.focus();
    return;
  }

  const productBeingUpdated = selectedProduct;
  const previousStock = getStockValue(productBeingUpdated);
  const newStock = previousStock + quantityToAdd;

  saveStockButton.disabled = true;
  saveStockButton.textContent = "Saving...";

  try {
    const productRef = doc(
      db,
      "users",
      currentUser.uid,
      "products",
      productBeingUpdated.id
    );

    await updateDoc(productRef, {
      stockQuantity: newStock,
      updatedAt: new Date()
    });

    await logActivity({
      action: "stock_in",
      description: "Added stock for " +
        (productBeingUpdated.name || "Unnamed Product"),
      targetType: "product_inventory",
      targetId: productBeingUpdated.id,
      details: {
        productName: productBeingUpdated.name || "Unnamed Product",
        previousStock,
        newStock,
        quantityChanged: quantityToAdd,
        unit: productBeingUpdated.unit || "units",
        reason
      }
    });

    productBeingUpdated.stockQuantity = newStock;

    updateSummary();
    renderProducts();
    closeStockModal();
    showToast("Stock added successfully.");
  } catch (error) {
    console.error("Stock update error:", error);
    showToast("Unable to add stock. Please try again.");
  } finally {
    saveStockButton.disabled = false;
    saveStockButton.textContent = "Add Stock";
  }
};

/* SEARCH */
searchInput.addEventListener("input", renderProducts);

/* FILTER BUTTONS */
document.querySelectorAll(".filter-btn").forEach((button) => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach((item) => {
      item.classList.remove("active");
    });

    button.classList.add("active");
    currentFilter = button.dataset.filter;
    renderProducts();
  });
});

/* TOAST */
function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  }, 2500);
}

/* BACK BUTTON */
window.goBack = function() {
  if (
    document.referrer &&
    document.referrer.includes(window.location.origin)
  ) {
    window.history.back();
  } else {
    window.location.href = "../dashboard/";
  }
};

/* AUTH STATE */
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "../login/";
    return;
  }

  currentUser = user;

  try {
    const userRef = doc(db, "users", user.uid);
    const userSnapshot = await getDoc(userRef);

    if (userSnapshot.exists()) {
      currentUserData = userSnapshot.data();
      currentUserRole = String(currentUserData.role || "owner").toLowerCase();
    } else {
      currentUserData = null;
      currentUserRole = "owner";
    }
  } catch (error) {
    console.error("USER PROFILE LOAD ERROR:", error);
    currentUserData = null;
    currentUserRole = "owner";
  }

  await loadInventory();
});
</script>
