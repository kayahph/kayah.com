
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B4F3A">
  <title>Materials & Stock - Kayah</title>

  <style>
    :root {
      --green: #0B4F3A;
      --green-light: #16805C;
      --yellow: #F2B84B;
      --cream: #F7F3E8;
      --white: #fff;
      --text: #26352d;
      --muted: #718078;
      --border: #e3e9e4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    /* BUSINESS HEADER */
    .business-header {
      background: linear-gradient(135deg, #0B4F3A, #16805C);
      color: white;
      padding: 14px 16px;
      box-shadow: 0 3px 12px rgba(11, 79, 58, .16);
    }

    .business-header-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .business-logo-wrap {
      width: 54px;
      height: 54px;
      flex: 0 0 54px;
      border-radius: 12px;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.24);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .business-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      background: white;
    }

    .logo-fallback {
      font-size: 25px;
      font-weight: 800;
      color: var(--yellow);
    }

    .business-heading {
      flex: 1;
      min-width: 0;
    }

    .business-name {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .business-subtitle {
      margin-top: 5px;
      color: rgba(255,255,255,.83);
      font-size: 12px;
    }

    .header-records-button {
      flex: 0 0 auto;
      border: 1px solid rgba(255,255,255,.35);
      background: rgba(255,255,255,.12);
      color: white;
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .header-records-button:active {
      background: rgba(255,255,255,.24);
    }

    .page {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 14px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }

    .search {
      flex: 1;
      min-width: 0;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid #d9e2db;
      border-radius: 8px;
      padding: 10px;
      background: white;
      color: var(--text);
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--green-light);
    }

    .search input { padding: 11px; }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      font-weight: 700;
      font-size: 12px;
      white-space: nowrap;
    }

    .primary { background: var(--green); color: white; }
    .secondary { background: #e6eee8; color: var(--green); }
    .yellow { background: var(--yellow); color: #342500; }
    .small { padding: 7px 9px; font-size: 11px; }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }

    .summary span {
      color: var(--muted);
      font-size: 12px;
    }

    .summary strong {
      color: var(--green);
      font-size: 18px;
    }

    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 12px 2px 8px;
    }

    .list-header h2 {
      color: var(--green);
      font-size: 15px;
      margin: 0;
    }

    .subtitle {
      color: var(--muted);
      font-size: 12px;
    }

    .material-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .material-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px;
    }

    .material-photo,
    .photo-placeholder {
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      border-radius: 8px;
      background: #edf2ed;
    }

    .material-photo {
      object-fit: cover;
      border: 1px solid #edf0ed;
    }

    .photo-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
    }

    .material-info {
      flex: 1;
      min-width: 0;
    }

    .material-name {
      color: var(--green);
      font-size: 13px;
      font-weight: 800;
      overflow-wrap: anywhere;
      margin-bottom: 4px;
    }

    .material-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 11px;
    }

    .category-tag {
      display: inline-block;
      padding: 3px 6px;
      background: #f1f5f1;
      border-radius: 5px;
      color: #52665a;
    }

    .stock-number {
      font-size: 13px;
      font-weight: 800;
      color: var(--green);
      text-align: right;
      white-space: nowrap;
    }

    .stock-label {
      display: block;
      font-size: 10px;
      font-weight: 400;
      color: var(--muted);
      margin-top: 3px;
    }

    .row-action { flex: 0 0 auto; }

    .empty, .loading {
      padding: 28px 12px;
      text-align: center;
      background: white;
      border: 1px dashed #cbd7ce;
      border-radius: 10px;
      color: var(--muted);
      line-height: 1.6;
    }

    .notice {
      display: none;
      padding: 11px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .notice.success {
      display: block;
      color: #145a32;
      background: #e8f6ec;
      border: 1px solid #c8e8d1;
    }

    .notice.error {
      display: block;
      color: #8d261d;
      background: #fff0ed;
      border: 1px solid #f0ccc6;
    }

    .notice.info {
      display: block;
      color: #365341;
      background: #edf4ee;
      border: 1px solid #d7e4d9;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,.48);
      padding: 14px;
      align-items: center;
      justify-content: center;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: 100%;
      max-width: 470px;
      max-height: 92vh;
      overflow-y: auto;
      background: white;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 10px 35px rgba(0,0,0,.18);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .modal-header h2 {
      color: var(--green);
      font-size: 17px;
      margin: 0;
    }

    .close-button {
      border: 0;
      background: #edf2ed;
      color: var(--green);
      border-radius: 7px;
      width: 32px;
      height: 32px;
      font-size: 20px;
    }

    .field { margin-bottom: 12px; }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 5px;
      color: #3d5145;
    }

    .field small {
      display: block;
      margin-top: 5px;
      font-size: 11px;
      line-height: 1.5;
      color: var(--muted);
    }

    .two-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .photo-preview {
      display: none;
      width: 76px;
      height: 76px;
      object-fit: cover;
      border-radius: 9px;
      margin-top: 8px;
      border: 1px solid var(--border);
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .modal-actions button { flex: 1; }

    .progress-text {
      color: var(--muted);
      font-size: 11px;
      margin-top: 8px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 480px) {
      .business-header { padding: 12px; }

      .business-header-inner { gap: 9px; }

      .business-logo-wrap {
        width: 44px;
        height: 44px;
        flex-basis: 44px;
      }

      .business-name { font-size: 15px; }

      .business-subtitle { font-size: 11px; }

      .header-records-button {
        padding: 8px;
        font-size: 10px;
      }

      .page { padding: 10px; }

      .material-row { gap: 8px; padding: 8px; }

      .material-photo,
      .photo-placeholder {
        width: 40px;
        height: 40px;
        flex-basis: 40px;
      }

      .stock-number { font-size: 12px; }

      .row-action .button {
        padding: 7px;
        font-size: 10px;
      }
    }

    @media (max-width: 350px) {
      .business-subtitle { display: none; }

      .header-records-button {
        white-space: normal;
        max-width: 82px;
      }

      .material-row { gap: 6px; }
    }
  </style>
</head>

<body>

  <!-- BUSINESS BRAND HEADER -->
  <header class="business-header">
    <div class="business-header-inner">

      <div class="business-logo-wrap">
        <img id="businessLogo" class="business-logo" alt="Business logo">
        <div id="logoFallback" class="logo-fallback">K</div>
      </div>

      <div class="business-heading">
        <h1 id="businessName" class="business-name">Loading business...</h1>
        <div class="business-subtitle">Materials & Stock</div>
      </div>

      <button
        type="button"
        class="header-records-button"
        id="inventoryRecordsButton"
      >
        Inventory Records ↗
      </button>

    </div>
  </header>

  <main class="page">
    <div id="notice" class="notice"></div>

    <section class="toolbar">
      <div class="search">
        <input
          type="search"
          id="searchMaterials"
          placeholder="Search materials..."
          aria-label="Search materials"
        >
      </div>

      <button type="button" class="button secondary" id="refreshButton">↻</button>

      <button type="button" class="button primary" id="addMaterialButton">+ Add</button>
    </section>

    <section class="summary">
      <span>Materials in your list</span>
      <strong id="materialCount">—</strong>
    </section>

    <div class="list-header">
      <h2>All Materials</h2>
      <span id="listStatus" class="subtitle">Loading...</span>
    </div>

    <section id="materialList" class="material-list">
      <div class="loading">Loading materials...</div>
    </section>
  </main>

  <!-- ADD MATERIAL -->
  <div class="modal-backdrop" id="addMaterialModal">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="addMaterialTitle">
      <div class="modal-header">
        <h2 id="addMaterialTitle">Add New Material</h2>
        <button type="button" class="close-button" data-close="addMaterialModal" aria-label="Close">×</button>
      </div>

      <form id="addMaterialForm">
        <div class="field">
          <label for="materialName">Material Name *</label>
          <input id="materialName" required maxlength="120" placeholder="Enter Material Name">
        </div>

        <div class="two-columns">
          <div class="field">
            <label for="materialCategory">Category</label>
            <input id="materialCategory" maxlength="80" placeholder="e.g. Packaging">
          </div>

          <div class="field">
            <label for="materialUnit">Unit *</label>
            <input id="materialUnit" required maxlength="30" value="pcs" placeholder="pcs, kg, box">
          </div>
        </div>

        <div class="field">
          <label for="materialPhoto">Material Photo</label>
          <input id="materialPhoto" type="file" accept="image/*">
          <small>Choose a photo to display beside the material. Maximum size: 5 MB.</small>
          <img id="materialPhotoPreview" class="photo-preview" alt="Material photo preview">
          <div id="photoUploadStatus" class="progress-text"></div>
        </div>

        <div class="two-columns">
          <div class="field">
            <label for="openingQuantity">Opening Stock</label>
            <input id="openingQuantity" type="number" min="0" step="any" value="0">
          </div>

          <div class="field">
            <label for="materialUnitCost">Unit Cost (₱)</label>
            <input id="materialUnitCost" type="number" min="0" step="any" placeholder="0.00">
          </div>
        </div>

        <div class="field">
          <label for="materialSupplier">Supplier</label>
          <input id="materialSupplier" maxlength="120" placeholder="Optional">
        </div>

        <div class="field">
          <label for="materialNotes">Notes</label>
          <textarea id="materialNotes" rows="2" maxlength="500" placeholder="Optional notes"></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="button secondary" data-close="addMaterialModal">Cancel</button>
          <button type="submit" class="button primary" id="saveMaterialButton">Save Material</button>
        </div>
      </form>
    </section>
  </div>

  <!-- ADD STOCK -->
  <div class="modal-backdrop" id="addStockModal">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="addStockTitle">
      <div class="modal-header">
        <h2 id="addStockTitle">Add Stock</h2>
        <button type="button" class="close-button" data-close="addStockModal" aria-label="Close">×</button>
      </div>

      <form id="addStockForm">
        <div class="field">
          <label for="stockMaterialSelect">Material *</label>
          <select id="stockMaterialSelect" required></select>
        </div>

        <div class="field">
          <label for="stockQuantity">Quantity to Add *</label>
          <input id="stockQuantity" type="number" min="0.000001" step="any" required placeholder="Enter quantity">
        </div>

        <div class="field">
          <label for="stockUnitCost">Unit Cost (₱)</label>
          <input id="stockUnitCost" type="number" min="0" step="any" placeholder="Optional">
        </div>

        <div class="field">
          <label for="stockSupplier">Supplier</label>
          <input id="stockSupplier" maxlength="120" placeholder="Optional">
        </div>

        <div class="field">
          <label for="stockNotes">Notes</label>
          <textarea id="stockNotes" rows="2" maxlength="500" placeholder="Invoice number or other details"></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="button secondary" data-close="addStockModal">Cancel</button>
          <button type="submit" class="button primary" id="saveStockButton">Save Stock</button>
        </div>
      </form>
    </section>
  </div>

  <script type="module">
    import { initializeApp, getApps }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import { getAuth, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      collection,
      getDocs,
      runTransaction,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC_7nSwcfgoUXEEe2yo9TJw0cp7XiwGF6w",
      authDomain: "kayah-ecosystem.firebaseapp.com",
      projectId: "kayah-ecosystem",
      storageBucket: "kayah-ecosystem.firebasestorage.app",
      messagingSenderId: "49853785143",
      appId: "1:49853785143:web:23182e6e11696ac03dcbb2"
    };

    const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Match these values to the Cloudinary setup already used by Kayah.
    const CLOUDINARY_CLOUD_NAME = "tfzuiwcp";
    const CLOUDINARY_UPLOAD_PRESET = "kayah_products";

    let currentUser = null;
    let businessId = null;
    let actorName = "Business Owner";
    let actorRole = "owner";
    let materials = [];
    let isSaving = false;
    let previewObjectUrl = null;

    const $ = id => document.getElementById(id);

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function showNotice(message, type = "info") {
      const notice = $("notice");
      notice.textContent = message;
      notice.className = "notice " + type;
      notice.style.display = "block";
      notice.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function clearNotice() {
      $("notice").textContent = "";
      $("notice").className = "notice";
      $("notice").style.display = "none";
    }

    function numberValue(value) {
      const number = Number(value);
      return Number.isFinite(number) ? number : 0;
    }

    function formatNumber(value) {
      return numberValue(value).toLocaleString("en-PH", {
        maximumFractionDigits: 3
      });
    }

    function getMaterialPhoto(material) {
      return material.photoUrl ||
        material.photoURL ||
        material.imageUrl ||
        material.imageURL ||
        material.image ||
        material.photo ||
        "";
    }

    function getMaterialName(material) {
      return material.name || material.materialName || "Unnamed Material";
    }

    function getMaterialUnit(material) {
      return material.unit || "pcs";
    }

    function getStock(material) {
      return numberValue(material.quantity ?? material.stock ?? 0);
    }

    function openModal(id) {
      $(id).classList.add("open");
    }

    function closeModal(id) {
      $(id).classList.remove("open");
    }

    function setButtonLoading(id, loading, loadingText, normalText) {
      $(id).disabled = loading;
      $(id).textContent = loading ? loadingText : normalText;
    }

    function actorFields() {
      return {
        performedByUid: currentUser.uid,
        performedByName: actorName,
        performedByRole: actorRole,
        actorUid: currentUser.uid,
        actorName,
        actorRole
      };
    }

    function getProfileName(profile) {
      return profile.businessName ||
        profile.storeName ||
        profile.companyName ||
        profile.name ||
        "My Business";
    }

    function getProfileLogo(profile) {
      return profile.businessLogoUrl ||
        profile.logoUrl ||
        profile.businessLogo ||
        profile.logoURL ||
        profile.logo ||
        "";
    }

    function displayBusinessBrand(profile) {
      const name = getProfileName(profile);
      const logoUrl = getProfileLogo(profile);

      $("businessName").textContent = name;
      document.title = "Materials & Stock - " + name;

      const logo = $("businessLogo");
      const fallback = $("logoFallback");

      fallback.textContent = name.trim().charAt(0).toUpperCase() || "B";
      logo.style.display = "none";
      logo.removeAttribute("src");
      fallback.style.display = "block";

      if (logoUrl) {
        logo.onload = () => {
          logo.style.display = "block";
          fallback.style.display = "none";
        };

        logo.onerror = () => {
          logo.style.display = "none";
          fallback.style.display = "block";
        };

        logo.src = logoUrl;
      }
    }

    // AUTH + LOAD THE BUSINESS OWNER'S BRANDING
    onAuthStateChanged(auth, async user => {
      if (!user) {
        window.location.href = "../login/";
        return;
      }

      currentUser = user;

      try {
        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);

        if (!userSnap.exists()) {
          showNotice("Your Kayah user profile could not be found.", "error");
          $("materialList").innerHTML =
            '<div class="empty">User profile not found.</div>';
          return;
        }

        const profile = userSnap.data();
        const role = String(profile.role || "owner").toLowerCase();
        const isStaff = role === "staff";

        if (
          profile.isActive === false ||
          String(profile.status || "").toLowerCase() === "inactive"
        ) {
          showNotice("This account is inactive. Please contact the business owner.", "error");
          return;
        }

        businessId = isStaff
          ? (profile.ownerUid || profile.businessOwnerUid || profile.businessId)
          : user.uid;

        if (!businessId) {
          showNotice("The business owner account could not be identified.", "error");
          return;
        }

        actorRole = isStaff ? "staff" : "owner";
        actorName = profile.fullName ||
          profile.name ||
          profile.displayName ||
          user.displayName ||
          user.email ||
          (isStaff ? "Staff Member" : "Business Owner");

        // Always load the business logo/name from the business owner's profile.
        let businessProfile = profile;

        if (isStaff) {
          const ownerSnap = await getDoc(doc(db, "users", businessId));

          if (ownerSnap.exists()) {
            businessProfile = ownerSnap.data();
          }
        }

        displayBusinessBrand(businessProfile);
        await loadMaterials();

      } catch (error) {
        console.error("Initialization error:", error);
        showNotice("Unable to initialize Materials: " + (error.message || "Please try again."), "error");
      }
    });

    // LOAD MATERIALS
    async function loadMaterials() {
      if (!businessId) return;

      $("materialList").innerHTML = '<div class="loading">Loading materials...</div>';
      $("listStatus").textContent = "Loading...";

      try {
        const materialsRef = collection(db, "users", businessId, "materials");
        const snapshot = await getDocs(materialsRef);

        materials = snapshot.docs.map(item => ({
          id: item.id,
          ...item.data()
        }));

        materials.sort((a, b) =>
          getMaterialName(a).localeCompare(getMaterialName(b))
        );

        renderMaterials();

      } catch (error) {
        console.error("Load materials error:", error);
        $("materialList").innerHTML =
          '<div class="empty">Unable to load materials.<br>Check your connection and Firebase permissions.</div>';
        $("listStatus").textContent = "Load failed";
        showNotice("Unable to load materials: " + (error.message || "Unknown error"), "error");
      }
    }

    // COMPACT MATERIAL LIST WITH PHOTOS
    function renderMaterials() {
      const search = $("searchMaterials").value.trim().toLowerCase();

      const filtered = materials.filter(material => {
        const text = [
          getMaterialName(material),
          material.category || "",
          getMaterialUnit(material),
          material.supplier || ""
        ].join(" ").toLowerCase();

        return text.includes(search);
      });

      $("materialCount").textContent = materials.length;
      $("listStatus").textContent =
        filtered.length + (filtered.length === 1 ? " item" : " items");

      if (!filtered.length) {
        $("materialList").innerHTML = materials.length
          ? '<div class="empty">No materials match your search.</div>'
          : '<div class="empty">No materials added yet.<br>Tap <b>+ Add</b> to create your first material.</div>';
        return;
      }

      $("materialList").innerHTML = filtered.map(material => {
        const name = getMaterialName(material);
        const photo = getMaterialPhoto(material);
        const unit = getMaterialUnit(material);
        const quantity = getStock(material);

        const category = material.category
          ? `<span class="category-tag">${escapeHtml(material.category)}</span>`
          : "";

        const photoHtml = photo
          ? `<img class="material-photo"
                  src="${escapeHtml(photo)}"
                  alt="${escapeHtml(name)}"
                  loading="lazy"
                  onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
             <div class="photo-placeholder" style="display:none;">📦</div>`
          : '<div class="photo-placeholder">📦</div>';

        return `
          <article class="material-row">
            ${photoHtml}
            <div class="material-info">
              <div class="material-name">${escapeHtml(name)}</div>
              <div class="material-meta">
                ${category}
                <span>${escapeHtml(unit)}</span>
              </div>
            </div>
            <div class="stock-number">
              ${escapeHtml(formatNumber(quantity))}
              <span class="stock-label">In stock</span>
            </div>
            <div class="row-action">
              <button type="button" class="button yellow small"
                data-add-stock="${escapeHtml(material.id)}">+ Stock</button>
            </div>
          </article>
        `;
      }).join("");
    }

    // PHOTO PREVIEW
    $("materialPhoto").addEventListener("change", event => {
      const file = event.target.files?.[0];
      const preview = $("materialPhotoPreview");

      $("photoUploadStatus").textContent = "";

      if (previewObjectUrl) {
        URL.revokeObjectURL(previewObjectUrl);
        previewObjectUrl = null;
      }

      if (!file) {
        preview.style.display = "none";
        preview.removeAttribute("src");
        return;
      }

      if (!file.type.startsWith("image/")) {
        event.target.value = "";
        preview.style.display = "none";
        $("photoUploadStatus").textContent = "Please choose an image file.";
        return;
      }

      if (file.size > 5 * 1024 * 1024) {
        event.target.value = "";
        preview.style.display = "none";
        $("photoUploadStatus").textContent = "Choose an image under 5 MB.";
        return;
      }

      previewObjectUrl = URL.createObjectURL(file);
      preview.src = previewObjectUrl;
      preview.style.display = "block";
    });

    // UPLOAD PHOTO TO CLOUDINARY
    async function uploadMaterialPhoto(file) {
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
      formData.append("folder", "kayah/materials");

      $("photoUploadStatus").textContent = "Uploading photo...";

      const response = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
        { method: "POST", body: formData }
      );

      const result = await response.json();

      if (!response.ok || !result.secure_url) {
        throw new Error(result.error?.message || "Unable to upload photo.");
      }

      $("photoUploadStatus").textContent = "Photo uploaded successfully.";
      return result.secure_url;
    }

    // OPEN ADD MATERIAL
    $("addMaterialButton").addEventListener("click", () => {
      clearNotice();
      $("addMaterialForm").reset();
      $("materialUnit").value = "pcs";
      $("openingQuantity").value = "0";
      $("materialPhotoPreview").style.display = "none";
      $("photoUploadStatus").textContent = "";

      if (previewObjectUrl) {
        URL.revokeObjectURL(previewObjectUrl);
        previewObjectUrl = null;
      }

      openModal("addMaterialModal");
    });

    // CREATE MATERIAL AND RECORD ACTIVITY
    $("addMaterialForm").addEventListener("submit", async event => {
      event.preventDefault();
      if (isSaving || !currentUser || !businessId) return;

      const name = $("materialName").value.trim();
      const category = $("materialCategory").value.trim();
      const unit = $("materialUnit").value.trim();
      const openingQuantity = Number($("openingQuantity").value || 0);
      const costText = $("materialUnitCost").value.trim();
      const unitCost = costText === "" ? null : Number(costText);
      const supplier = $("materialSupplier").value.trim();
      const notes = $("materialNotes").value.trim();
      const photoFile = $("materialPhoto").files?.[0] || null;

      if (!name || !unit) {
        showNotice("Please enter a material name and unit.", "error");
        return;
      }

      if (!Number.isFinite(openingQuantity) || openingQuantity < 0) {
        showNotice("Opening stock must be zero or greater.", "error");
        return;
      }

      if (unitCost !== null && (!Number.isFinite(unitCost) || unitCost < 0)) {
        showNotice("Unit cost must be zero or greater.", "error");
        return;
      }

      isSaving = true;
      setButtonLoading("saveMaterialButton", true, "Saving...", "Save Material");

      try {
        let photoUrl = "";

        if (photoFile) {
          photoUrl = await uploadMaterialPhoto(photoFile);
        }

        const materialRef = doc(collection(db, "users", businessId, "materials"));
        const activityRef = doc(collection(db, "users", businessId, "activityLogs"));

        const movementRef = openingQuantity > 0
          ? doc(collection(db, "users", businessId, "materialInventory"))
          : null;

        const stockActivityRef = openingQuantity > 0
          ? doc(collection(db, "users", businessId, "activityLogs"))
          : null;

        const actor = actorFields();

        await runTransaction(db, async transaction => {
          transaction.set(materialRef, {
            name,
            category,
            unit,
            quantity: openingQuantity,
            unitCost,
            supplier,
            notes,
            photoUrl,
            ownerUid: businessId,
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp(),
            createdByUid: currentUser.uid,
            createdByName: actorName,
            createdByRole: actorRole,
            updatedByUid: currentUser.uid,
            updatedByName: actorName,
            updatedByRole: actorRole
          });

          transaction.set(activityRef, {
            action: "material_created",
            description: `Created material: ${name}`,
            targetType: "material",
            targetId: materialRef.id,
            ...actor,
            details: {
              materialId: materialRef.id,
              materialName: name,
              category,
              unit,
              openingStock: openingQuantity,
              unitCost,
              supplier,
              hasPhoto: Boolean(photoUrl)
            },
            createdAt: serverTimestamp()
          });

          if (openingQuantity > 0) {
            transaction.set(movementRef, {
              materialId: materialRef.id,
              materialName: name,
              type: "stock-in",
              quantity: openingQuantity,
              unit,
              unitCost,
              supplier,
              notes: notes || "Opening stock",
              balanceAfter: openingQuantity,
              ownerUid: businessId,
              createdAt: serverTimestamp(),
              ...actor
            });

            transaction.set(stockActivityRef, {
              action: "material_stock_in",
              description: `Added opening stock of ${formatNumber(openingQuantity)} ${unit} for ${name}`,
              targetType: "material",
              targetId: materialRef.id,
              ...actor,
              details: {
                materialId: materialRef.id,
                materialName: name,
                previousStock: 0,
                addedStock: openingQuantity,
                newStock: openingQuantity,
                unit,
                unitCost,
                supplier,
                notes: notes || "Opening stock"
              },
              createdAt: serverTimestamp()
            });
          }
        });

        closeModal("addMaterialModal");
        showNotice("Material added successfully.", "success");
        await loadMaterials();

      } catch (error) {
        console.error("Save material error:", error);
        showNotice("Unable to save material: " + (error.message || "Please try again."), "error");

      } finally {
        isSaving = false;
        setButtonLoading("saveMaterialButton", false, "Saving...", "Save Material");
      }
    });

    // OPEN ADD STOCK FORM
    function openAddStock(materialId = "") {
      clearNotice();

      if (!materials.length) {
        showNotice("Add a material before recording stock.", "info");
        return;
      }

      $("stockMaterialSelect").innerHTML = materials.map(material => `
        <option value="${escapeHtml(material.id)}">
          ${escapeHtml(getMaterialName(material))}
          (${escapeHtml(formatNumber(getStock(material)))} ${escapeHtml(getMaterialUnit(material))})
        </option>
      `).join("");

      if (materialId) $("stockMaterialSelect").value = materialId;

      $("stockQuantity").value = "";
      $("stockUnitCost").value = "";
      $("stockSupplier").value = "";
      $("stockNotes").value = "";

      openModal("addStockModal");
    }

    $("materialList").addEventListener("click", event => {
      const button = event.target.closest("[data-add-stock]");
      if (button) openAddStock(button.dataset.addStock);
    });

    // SAVE STOCK MOVEMENT AND ACTIVITY LOG
    $("addStockForm").addEventListener("submit", async event => {
      event.preventDefault();
      if (isSaving || !currentUser || !businessId) return;

      const materialId = $("stockMaterialSelect").value;
      const addedQuantity = Number($("stockQuantity").value);
      const costText = $("stockUnitCost").value.trim();
      const unitCost = costText === "" ? null : Number(costText);
      const supplier = $("stockSupplier").value.trim();
      const notes = $("stockNotes").value.trim();

      if (!materialId) {
        showNotice("Please select a material.", "error");
        return;
      }

      if (!Number.isFinite(addedQuantity) || addedQuantity <= 0) {
        showNotice("Enter a quantity greater than zero.", "error");
        return;
      }

      if (unitCost !== null && (!Number.isFinite(unitCost) || unitCost < 0)) {
        showNotice("Unit cost must be zero or greater.", "error");
        return;
      }

      isSaving = true;
      setButtonLoading("saveStockButton", true, "Saving...", "Save Stock");

      try {
        const materialRef = doc(db, "users", businessId, "materials", materialId);
        const movementRef = doc(collection(db, "users", businessId, "materialInventory"));
        const activityRef = doc(collection(db, "users", businessId, "activityLogs"));
        const actor = actorFields();

        await runTransaction(db, async transaction => {
          const materialSnap = await transaction.get(materialRef);

          if (!materialSnap.exists()) {
            throw new Error("This material no longer exists. Refresh the list.");
          }

          const material = materialSnap.data();
          const materialName = getMaterialName(material);
          const unit = getMaterialUnit(material);
          const previousStock = getStock(material);
          const newStock = previousStock + addedQuantity;

          transaction.update(materialRef, {
            quantity: newStock,
            updatedAt: serverTimestamp(),
            updatedByUid: currentUser.uid,
            updatedByName: actorName,
            updatedByRole: actorRole
          });

          transaction.set(movementRef, {
            materialId,
            materialName,
            type: "stock-in",
            quantity: addedQuantity,
            unit,
            unitCost,
            supplier,
            notes,
            balanceAfter: newStock,
            ownerUid: businessId,
            createdAt: serverTimestamp(),
            ...actor
          });

          transaction.set(activityRef, {
            action: "material_stock_in",
            description: `Added ${formatNumber(addedQuantity)} ${unit} of ${materialName}`,
            targetType: "material",
            targetId: materialId,
            ...actor,
            details: {
              materialId,
              materialName,
              previousStock,
              addedStock: addedQuantity,
              newStock,
              unit,
              unitCost,
              supplier,
              notes
            },
            createdAt: serverTimestamp()
          });
        });

        closeModal("addStockModal");
        showNotice("Stock added and activity recorded successfully.", "success");
        await loadMaterials();

      } catch (error) {
        console.error("Add stock error:", error);
        showNotice("Unable to add stock: " + (error.message || "Please try again."), "error");

      } finally {
        isSaving = false;
        setButtonLoading("saveStockButton", false, "Saving...", "Save Stock");
      }
    });

    // SEARCH, REFRESH, HEADER NAVIGATION AND MODALS
    $("searchMaterials").addEventListener("input", renderMaterials);

    $("refreshButton").addEventListener("click", async () => {
      clearNotice();
      await loadMaterials();
    });

    $("inventoryRecordsButton").addEventListener("click", () => {
      window.location.href = "inventory-record/index.htm";
    });

    document.querySelectorAll("[data-close]").forEach(button => {
      button.addEventListener("click", () => closeModal(button.dataset.close));
    });

    document.querySelectorAll(".modal-backdrop").forEach(backdrop => {
      backdrop.addEventListener("click", event => {
        if (event.target === backdrop) closeModal(backdrop.id);
      });
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        document.querySelectorAll(".modal-backdrop.open").forEach(modal => {
          closeModal(modal.id);
        });
      }
    });
  </script>
</body>
</html>
