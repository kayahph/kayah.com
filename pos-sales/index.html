<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Kayah POS Sales</title>

<style>
    
    /* =====================================================
   DAILY REPORT POPUPS
===================================================== */

.daily-report-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,28,22,.58);
    z-index:200;
    display:none;
    align-items:flex-end;
    justify-content:center;
}

.daily-report-overlay.show{
    display:flex;
}

.daily-report-panel{
    width:100%;
    max-width:650px;
    max-height:94vh;
    overflow-y:auto;
    background:#f4f7f5;
    border-radius:22px 22px 0 0;
    animation:dailyReportUp .2s ease;
}

@keyframes dailyReportUp{
    from{
        transform:translateY(40px);
        opacity:0;
    }

    to{
        transform:translateY(0);
        opacity:1;
    }
}

.daily-report-header{
    background:
        linear-gradient(
            135deg,
            #0B4F3A,
            #16805C
        );
    color:white;
    padding:18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.daily-report-title{
    font-size:18px;
    font-weight:900;
}

.daily-report-subtitle{
    font-size:10px;
    opacity:.75;
    margin-top:4px;
}

.daily-report-close{
    width:36px;
    height:36px;
    border:0;
    border-radius:11px;
    background:rgba(255,255,255,.14);
    color:white;
    font-size:22px;
    cursor:pointer;
}

.daily-report-content{
    padding:18px;
}

.daily-report-label{
    display:block;
    font-size:11px;
    font-weight:800;
    color:#4e5b53;
    margin-bottom:7px;
}

.daily-report-date{
    width:100%;
    height:46px;
    border:1px solid #dce5df;
    border-radius:12px;
    background:white;
    padding:0 13px;
    font-size:14px;
    outline:none;
}

.daily-report-date:focus{
    border-color:#16805C;
}

.daily-report-note{
    margin-top:9px;
    font-size:11px;
    line-height:1.5;
    color:#7b857f;
}

.generate-report-button{
    width:100%;
    margin-top:17px;
    height:46px;
    border:0;
    border-radius:13px;
    background:#16805C;
    color:white;
    font-size:13px;
    font-weight:800;
    cursor:pointer;
}

.generate-report-button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.daily-report-status{
    margin-top:12px;
    font-size:11px;
    line-height:1.5;
}

.report-summary-card{
    background:white;
    border:1px solid #e2e9e5;
    border-radius:15px;
    padding:15px;
    margin-bottom:12px;
}

.report-business{
    font-size:16px;
    font-weight:900;
    color:#0B4F3A;
}

.report-finalized{
    display:inline-block;
    margin-top:6px;
    background:#edf7f2;
    color:#0B684B;
    border-radius:20px;
    padding:5px 9px;
    font-size:9px;
    font-weight:900;
}

.report-main-total{
    margin-top:15px;
    font-size:28px;
    font-weight:900;
    color:#16805C;
}

.report-total-label{
    font-size:10px;
    color:#7d8881;
}

.report-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:12px;
}

.report-stat{
    background:#f7f9f8;
    border-radius:11px;
    padding:11px;
}

.report-stat-label{
    display:block;
    font-size:9px;
    color:#7d8881;
}

.report-stat-value{
    display:block;
    margin-top:3px;
    font-size:13px;
    font-weight:900;
    color:#28342d;
}

.report-section{
    background:white;
    border:1px solid #e2e9e5;
    border-radius:15px;
    padding:15px;
    margin-bottom:12px;
}

.report-section-title{
    font-size:11px;
    font-weight:900;
    color:#0B4F3A;
    text-transform:uppercase;
    margin-bottom:10px;
}

.report-line{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:7px 0;
    border-bottom:1px solid #eef2ef;
    font-size:11px;
}

.report-line:last-child{
    border-bottom:0;
}

.report-line strong{
    color:#28342d;
}

.report-generated{
    font-size:10px;
    color:#7d8881;
    line-height:1.6;
}

.report-sale{
    padding:10px 0;
    border-bottom:1px solid #eef2ef;
}

.report-sale:last-child{
    border-bottom:0;
}

.report-sale-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.report-sale-number{
    font-size:11px;
    font-weight:900;
    color:#0B4F3A;
}

.report-sale-total{
    font-size:12px;
    font-weight:900;
    color:#16805C;
}

.report-sale-bottom{
    margin-top:4px;
    font-size:9px;
    color:#7d8881;
}

@media(max-width:500px){

    .daily-report-content{
        padding:14px;
    }

}
    
    
    
    


/* =====================================================
   DAILY SALES REPORT
===================================================== */

.daily-report-action{
    margin-bottom:16px;
}

.daily-report-button{
    width:100%;
    border:0;
    background:white;
    border:1px solid #dfe8e3;
    border-radius:16px;
    padding:14px;
    display:flex;
    align-items:center;
    gap:12px;
    text-align:left;
    cursor:pointer;
    box-shadow:0 4px 15px rgba(0,0,0,.04);
}

.daily-report-button:active{
    transform:scale(.99);
}

.daily-report-icon{
    width:42px;
    height:42px;
    border-radius:12px;
    background:#edf7f2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    flex-shrink:0;
}

.daily-report-button span:nth-child(2){
    flex:1;
    min-width:0;
}

.daily-report-button strong{
    display:block;
    font-size:13px;
    color:#0B4F3A;
}

.daily-report-button small{
    display:block;
    margin-top:3px;
    font-size:10px;
    color:#7a857f;
}

.daily-report-arrow{
    font-size:25px;
    color:#16805C;
}



*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    background:#f4f7f5;
    color:#17231d;
}

body{
    min-height:100vh;
}

/* =====================================================
   HEADER
===================================================== */

.top-header{
    background:
        linear-gradient(
            135deg,
            #0B4F3A,
            #16805C
        );
    color:white;
    padding:
        14px
        16px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:
        0 3px 14px rgba(0,0,0,.14);
}

.header-row{
    max-width:900px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:11px;
}

.back-btn{
    width:38px;
    height:38px;
    border:0;
    border-radius:12px;
    background:rgba(255,255,255,.14);
    color:white;
    font-size:28px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

.header-logo-wrap{
    width:42px;
    height:42px;
    border-radius:12px;
    overflow:hidden;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.header-logo{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

.business-placeholder{
    color:#0B4F3A;
    font-weight:800;
    font-size:19px;
}

.header-business{
    min-width:0;
    flex:1;
}

.header-business-name{
    font-size:16px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.header-subtitle{
    font-size:11px;
    opacity:.78;
    margin-top:2px;
}

.role-badge{
    font-size:10px;
    font-weight:800;
    letter-spacing:.5px;
    padding:
        6px
        9px;
    border-radius:20px;
    background:rgba(255,255,255,.15);
    white-space:nowrap;
}

/* =====================================================
   PAGE
===================================================== */

.page{
    max-width:900px;
    margin:auto;
    padding:16px;
}

/* =====================================================
   TODAY SUMMARY
===================================================== */

.today-card{
    background:
        linear-gradient(
            135deg,
            #0B4F3A,
            #16805C
        );
    color:white;
    border-radius:20px;
    padding:20px;
    margin-bottom:16px;
    box-shadow:
        0 8px 25px rgba(11,79,58,.16);
}

.today-label{
    font-size:11px;
    font-weight:800;
    letter-spacing:.8px;
    opacity:.78;
}

.today-date{
    font-size:12px;
    margin-top:4px;
    opacity:.82;
}

.today-main{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:15px;
    margin-top:8px;
}

.today-total{
    font-size:31px;
    font-weight:900;
    line-height:1;
}

.today-count{
    text-align:right;
}

.today-count strong{
    display:block;
    font-size:23px;
}

.today-count span{
    font-size:10px;
    opacity:.75;
}

.today-bottom{
    display:flex;
    gap:10px;
    margin-top:17px;
}

.today-stat{
    flex:1;
    background:rgba(255,255,255,.11);
    border-radius:12px;
    padding:10px;
}

.today-stat-label{
    display:block;
    font-size:10px;
    opacity:.72;
}

.today-stat strong{
    display:block;
    font-size:14px;
    margin-top:3px;
}

/* =====================================================
   SEARCH
===================================================== */

.search-wrap{
    position:relative;
    margin-bottom:15px;
}

.search-icon{
    position:absolute;
    left:13px;
    top:50%;
    transform:translateY(-50%);
    color:#78857d;
    font-size:15px;
}

.search-input{
    width:100%;
    height:45px;
    border:1px solid #dce5df;
    border-radius:13px;
    background:white;
    padding:
        0
        14px
        0
        40px;
    outline:none;
    font-size:14px;
}

.search-input:focus{
    border-color:#16805C;
    box-shadow:
        0 0 0 3px rgba(22,128,92,.09);
}

/* =====================================================
   SALES HEADER
===================================================== */

.sales-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.sales-heading h2{
    margin:0;
    font-size:17px;
}

.sales-count{
    font-size:11px;
    color:#748078;
}

/* =====================================================
   SALES LIST
===================================================== */

.sales-list{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.sale-card{
    background:white;
    border:1px solid #e3e9e5;
    border-radius:15px;
    padding:14px;
    cursor:pointer;
    transition:
        transform .15s ease,
        box-shadow .15s ease;
}

.sale-card:active{
    transform:scale(.99);
}

.sale-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.sale-number{
    font-size:13px;
    font-weight:900;
    color:#0B4F3A;
}

.sale-total{
    font-size:16px;
    font-weight:900;
    color:#16805C;
}

.sale-middle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:7px;
}

.sale-date{
    font-size:11px;
    color:#7b857f;
}

.payment-badge{
    font-size:9px;
    font-weight:800;
    color:#0B684B;
    background:#edf7f2;
    padding:
        5px
        8px;
    border-radius:20px;
}

.sale-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:9px;
    padding-top:9px;
    border-top:1px solid #eef2ef;
}

.sale-cashier{
    font-size:10px;
    color:#66726b;
}

.role-small{
    font-weight:800;
    color:#16805C;
}

.sale-items-count{
    font-size:10px;
    color:#7b857f;
}

.empty-box{
    background:white;
    border:1px solid #e3e9e5;
    border-radius:16px;
    padding:35px 20px;
    text-align:center;
    color:#78837c;
}

.empty-icon{
    font-size:30px;
    margin-bottom:8px;
}

.empty-title{
    font-weight:800;
    color:#435048;
}

.empty-text{
    font-size:12px;
    margin-top:5px;
}

/* =====================================================
   INVOICE OVERLAY
===================================================== */

.invoice-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,28,22,.55);
    z-index:100;
    display:none;
    align-items:flex-end;
    justify-content:center;
    padding:0;
}

.invoice-overlay.show{
    display:flex;
}

.invoice-panel{
    width:100%;
    max-width:650px;
    max-height:94vh;
    overflow-y:auto;
    background:#f4f7f5;
    border-radius:
        22px
        22px
        0
        0;
    padding:14px;
    animation:
        invoiceUp .2s ease;
}

@keyframes invoiceUp{
    from{
        transform:translateY(40px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

.invoice-actions{
    display:flex;
    justify-content:flex-end;
    margin-bottom:8px;
}

.close-invoice{
    width:36px;
    height:36px;
    border:0;
    border-radius:11px;
    background:white;
    color:#39443e;
    font-size:21px;
    cursor:pointer;
}

/* =====================================================
   INVOICE
===================================================== */

.invoice{
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:
        0 10px 35px rgba(0,0,0,.08);
}

.invoice-header{
    padding:20px;
    background:
        linear-gradient(
            135deg,
            #0B4F3A,
            #16805C
        );
    color:white;
}

.invoice-brand{
    display:flex;
    align-items:center;
    gap:11px;
}

.invoice-logo-wrap{
    width:48px;
    height:48px;
    background:white;
    border-radius:12px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
}

.invoice-logo{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

.invoice-logo-placeholder{
    color:#0B4F3A;
    font-weight:900;
}

.invoice-business-name{
    font-size:18px;
    font-weight:900;
}

.invoice-business-subtitle{
    font-size:10px;
    opacity:.78;
    margin-top:2px;
}

.invoice-title-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:15px;
    margin-top:20px;
}

.invoice-title{
    font-size:21px;
    font-weight:900;
    letter-spacing:.5px;
}

.invoice-number{
    font-size:12px;
    font-weight:800;
    text-align:right;
}

.invoice-body{
    padding:18px;
}

.invoice-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:18px;
}

.info-box{
    background:#f7f9f8;
    border-radius:11px;
    padding:10px;
}

.info-label{
    display:block;
    font-size:9px;
    color:#7d8881;
    text-transform:uppercase;
    letter-spacing:.4px;
}

.info-value{
    display:block;
    font-size:11px;
    font-weight:800;
    margin-top:3px;
}

.invoice-section-title{
    font-size:11px;
    font-weight:900;
    color:#0B4F3A;
    text-transform:uppercase;
    margin-bottom:8px;
}

.invoice-items{
    border-top:1px solid #e7ece9;
}

.invoice-item{
    display:grid;
    grid-template-columns:
        minmax(0,1fr)
        45px
        75px
        80px;
    gap:6px;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid #eef1ef;
}

.invoice-item-name{
    font-size:11px;
    font-weight:700;
}

.invoice-item-qty,
.invoice-item-price{
    text-align:right;
    font-size:10px;
    color:#657169;
}

.invoice-item-total{
    text-align:right;
    font-size:11px;
    font-weight:800;
}

.invoice-summary{
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid #dfe6e2;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:5px 0;
    font-size:11px;
}

.summary-row.total{
    margin-top:5px;
    padding-top:11px;
    border-top:1px dashed #d9e1dc;
    font-size:15px;
    font-weight:900;
}

.invoice-total{
    color:#16805C;
    font-size:18px;
}

.payment-section{
    margin-top:18px;
}

.payment-card{
    background:#f7f9f8;
    border-radius:12px;
    padding:12px;
}

.payment-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:4px 0;
    font-size:11px;
}

.payment-row strong{
    color:#28342d;
}

.invoice-footer{
    margin-top:20px;
    padding-top:13px;
    border-top:1px solid #e8edea;
    text-align:center;
    font-size:9px;
    color:#89938d;
}

/* =====================================================
   LOADING
===================================================== */

.loading{
    padding:45px 20px;
    text-align:center;
    color:#7a857f;
}

.spinner{
    width:30px;
    height:30px;
    border-radius:50%;
    border:
        3px solid #dce9e2;
    border-top-color:#16805C;
    animation:
        spin .8s linear infinite;
    margin:
        0 auto
        12px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:500px){

    .page{
        padding:12px;
    }

    .today-total{
        font-size:28px;
    }

    .invoice-item{
        grid-template-columns:
            minmax(0,1fr)
            38px
            65px
            70px;
    }

    .invoice-body{
        padding:14px;
    }

}

</style>

</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header class="top-header">

    <div class="header-row">

        <button
            class="back-btn"
            type="button"
            onclick="goBack()"
        >
            ‹
        </button>

        <div class="header-logo-wrap">

            <img
                id="headerLogo"
                class="header-logo"
                alt="Business logo"
            >

            <div
                id="headerLogoPlaceholder"
                class="business-placeholder"
            >
                K
            </div>

        </div>

        <div class="header-business">

            <div
                id="headerBusinessName"
                class="header-business-name"
            >
                Business
            </div>

            <div class="header-subtitle">
                POS Sales
            </div>

        </div>

        <div
            id="headerRole"
            class="role-badge"
        >
            OWNER
        </div>

    </div>

</header>


<!-- =====================================================
     PAGE
===================================================== -->

<main class="page">

    <!-- TODAY -->

    <section class="today-card">

        <div class="today-label">
            TODAY'S SALES
        </div>

        <div
            id="todayDate"
            class="today-date"
        >
            —
        </div>

        <div class="today-main">

            <div
                id="todayTotal"
                class="today-total"
            >
                ₱0.00
            </div>

            <div class="today-count">

                <strong id="todayTransactions">
                    0
                </strong>

                <span>
                    transactions
                </span>

            </div>

        </div>

        <div class="today-bottom">

            <div class="today-stat">

                <span class="today-stat-label">
                    Items Sold
                </span>

                <strong id="todayItems">
                    0
                </strong>

            </div>

            <div class="today-stat">

                <span class="today-stat-label">
                    Average Sale
                </span>

                <strong id="todayAverage">
                    ₱0.00
                </strong>

            </div>

        </div>

    </section>


<!-- =====================================================
     DAILY SALES REPORT
===================================================== -->

<div class="daily-report-action">

    <button
        type="button"
        class="daily-report-button"
        onclick="openDailyReportGenerator()"
    >
        <span class="daily-report-icon">
            📊
        </span>

        <span>
            <strong>Daily Sales Report</strong>
            <small>Generate today's finalized sales report</small>
        </span>

        <span class="daily-report-arrow">
            ›
        </span>
    </button>

</div>


    <!-- SEARCH -->

    <div class="search-wrap">

        <div class="search-icon">
            🔎
        </div>

        <input
            id="searchInput"
            class="search-input"
            type="search"
            placeholder="Search sales..."
            autocomplete="off"

/* =====================================================

function peso(value){

    const amount =
        Number(value || 0);

    return "₱" +
        amount.toLocaleString(
            "en-PH",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


function getDateValue(createdAt){

    if(!createdAt){
        return null;
    }

    if(
        typeof createdAt.toDate ===
        "function"
    ){
        return createdAt.toDate();
    }

    if(
        createdAt instanceof Date
    ){
        return createdAt;
    }

    if(
        typeof createdAt === "number"
    ){
        return new Date(createdAt);
    }

    if(
        typeof createdAt === "string"
    ){

        const date =
            new Date(createdAt);

        if(
            !isNaN(
                date.getTime()
            )
        ){
            return date;
        }

    }

    return null;

}


function formatDateTime(createdAt){

    const date =
        getDateValue(createdAt);

    if(!date){
        return "Date unavailable";
    }

    return date.toLocaleString(
        "en-PH",
        {
            year:"numeric",
            month:"short",
            day:"numeric",
            hour:"numeric",
            minute:"2-digit"
        }
    );

}


function formatInvoiceDate(createdAt){

    const date =
        getDateValue(createdAt);

    if(!date){
        return "Date unavailable";
    }

    return date.toLocaleString(
        "en-PH",
        {
            year:"numeric",
            month:"short",
            day:"numeric",
            hour:"numeric",
            minute:"2-digit",
            second:"2-digit"
        }
    );

}


function isToday(createdAt){

    const date =
        getDateValue(createdAt);

    if(!date){
        return false;
    }

    const now =
        new Date();

    return (
        date.getFullYear() ===
            now.getFullYear()
        &&
        date.getMonth() ===
            now.getMonth()
        &&
        date.getDate() ===
            now.getDate()
    );

}


function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function getPaymentLabel(sale){

    if(
        sale.paymentMethod
    ){

        return String(
            sale.paymentMethod
        )
        .replace(
            /_/g,
            " "
        )
        .replace(
            /\b\w/g,
            c =>
                c.toUpperCase()
        );

    }

    return "Payment";

}


function getTransactionTypeLabel(value){

    const type =
        String(
            value || "walkin"
        ).toLowerCase();

    const labels = {

        walkin: "Walk-in",

        pickup: "Pickup",

        delivery: "Delivery",

        appointment: "Appointment",

        service: "Service",

        order: "Order",

        booking: "Booking",

        service_order: "Service Order",

        online_order: "Online Order"

    };

    return (
        labels[type] ||
        "Walk-in"
    );

}



function getCashierName(sale){

        sale.cashierName ||
        sale.staffName ||
        "Unknown"
    );

}


function getRoleLabel(sale){

    return role === "staff"

}

/* =====================================================
   BUSINESS LOGO

/* =====================================================
   TRANSACTION NUMBER
=====================================================

   IMPORTANT:
   This is DISPLAY ONLY.

   sale.id remains the real Firebase
   document ID and is never changed.
===================================================== */

function getTransactionNumber(sale){

    const date =
        getDateValue(
            sale.createdAt
        );

    if(!date){

        return (
            "TXN-UNKNOWN-" +
            String(sale.id)
                .slice(0,6)
                .toUpperCase()
        );

    }

    const datePart =
        date.getFullYear()
            .toString() +

        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        ) +

        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );


    /*
       Build the daily sequence from
       the sales already loaded from Firebase.
    */

    const sameDaySales =
        sales
        .filter(
            function(item){

                const itemDate =
                    getDateValue(
                        item.createdAt
                    );

                if(!itemDate){
                    return false;
                }

                return (
                    itemDate.getFullYear() ===
                        date.getFullYear()
                    &&
                    itemDate.getMonth() ===
                        date.getMonth()
                    &&
                    itemDate.getDate() ===
                        date.getDate()
                );

            }
        )
        .sort(
            function(a,b){

                const timeA =
                    getDateValue(
                        a.createdAt
                    )?.getTime() || 0;

                const timeB =
                    getDateValue(
                        b.createdAt
                    )?.getTime() || 0;

                /*
                   Firebase document ID is only
                   used as a deterministic tie-breaker.
                   It is NOT changed.
                */

                return (
                    timeA - timeB
                ) ||
                String(a.id)
                    .localeCompare(
                        String(b.id)
                    );

            }
        );


    const index =
        sameDaySales.findIndex(
            function(item){
                return item.id === sale.id;
            }
        );


    const sequence =
        String(
            index >= 0
                ? index + 1
                : 1
        )
        .padStart(
            3,
            "0"
        );


    return (
        "TXN-" +
        datePart +
        "-" +
        sequence
    );

}

/* =====================================================
   LOAD SALES
===================================================== */

async function loadSales(){

    sales = [];


    const salesRef =
        collection(
            db,
            "users",
            currentBusinessId,
            "sales"
        );


    let snapshot;


    try{

        snapshot =
            await getDocs(
                query(
                    salesRef,
                    orderBy(
                        "createdAt",
                        "desc"
                    )
                )
            );

    }catch(error){

        /*
           Keep the existing fallback.
           This prevents the page from failing if
           an index is unavailable.
        */

        console.warn(
            "Ordered sales query failed. Using fallback.",
            error
        );

        snapshot =
            await getDocs(
                salesRef
            );

    }


    snapshot.forEach(
        saleDoc => {

            sales.push({

                id:
                    saleDoc.id,

                ...saleDoc.data()

            });

        }
    );


    sales.sort(
        function(a,b){

            const timeA =
                getDateValue(
                    a.createdAt
                )?.getTime() || 0;

            const timeB =
                getDateValue(
                    b.createdAt
                )?.getTime() || 0;

            return (
                timeB - timeA
            );

        }
    );


    updateTodaySummary();

    renderSales();

}


/* =====================================================
   TODAY SUMMARY
===================================================== */

function updateTodaySummary(){

    const todaySales =
        sales.filter(
            sale =>
                isToday(
                    sale.createdAt
                )
        );


    const total =
        todaySales.reduce(
            function(sum,sale){

                return sum +
                    Number(
                        sale.total || 0
                    );

            },
            0
        );


    const items =
        todaySales.reduce(
            function(sum,sale){

                const saleItems =
                    Array.isArray(
                        sale.items
                    )
                    ? sale.items
                    : [];


                return sum +
                    saleItems.reduce(
                        function(itemSum,item){

                            return itemSum +
                                Number(
                                    item.quantity || 0
                                );

                        },
                        0
                    );

            },
            0
        );


    const average =
        todaySales.length
            ? total / todaySales.length
            : 0;


    const now =
        new Date();


    document.getElementById(
        "todayDate"
    ).textContent =
        now.toLocaleDateString(
            "en-PH",
            {
                year:"numeric",
                month:"long",
                day:"numeric"
            }
        );


    document.getElementById(
        "todayTotal"
    ).textContent =
        peso(total);


    document.getElementById(
        "todayTransactions"
    ).textContent =
        todaySales.length;


    document.getElementById(
        "todayItems"
    ).textContent =
        items;


    document.getElementById(
        "todayAverage"
    ).textContent =
        peso(average);

}

function getBusinessDateKey(date){

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            date.getDate()
        ).padStart(2,"0");

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


function getSalesForBusinessDate(dateString){

    return sales.filter(
        function(sale){

            const date =
                getDateValue(
                    sale.createdAt
                );

            if(!date){
                return false;
            }

            const saleDate =
                getBusinessDateKey(
                    date
                );

            return saleDate === dateString;

        }
    );

}


function getReportTotals(reportSales){

    let totalSales = 0;

    let totalItems = 0;

    let cashTotal = 0;

    let creditTotal = 0;

    let qrTotal = 0;

    let gcashTotal = 0;

    let mayaTotal = 0;

    const transactionTypes = {};


    reportSales.forEach(
        function(sale){

            const total =
                Number(
                    sale.total || 0
                );

            totalSales += total;


            const items =
                Array.isArray(
                    sale.items
                )
                ? sale.items
                : [];


            items.forEach(
                function(item){

                    totalItems +=
                        Number(
                            item.quantity || 0
                        );

                }
            );


            const payment =
                String(
                    sale.paymentMethod || ""
                ).toLowerCase();


            if(payment === "cash"){

                cashTotal += total;

            }else if(payment === "credit"){

                creditTotal += total;

            }else if(payment === "qr"){

                qrTotal += total;

                const qrMethod =
                    String(
                        sale.qrMethod || ""
                    ).toLowerCase();

                if(qrMethod === "gcash"){

                    gcashTotal += total;

                }else if(qrMethod === "maya"){

                    mayaTotal += total;

                }

            }


            const type =
                String(
                    sale.transactionType ||
                    "walkin"
                ).toLowerCase();


            transactionTypes[type] =
                (
                    transactionTypes[type] ||
                    {
                        count:0,
                        total:0
                    }
                );


            transactionTypes[type].count++;

            transactionTypes[type].total +=
                total;

        }
    );


    return {

        totalSales,

        transactionCount:
            reportSales.length,

        totalItems,

        cashTotal,

        creditTotal,

        qrTotal,

        gcashTotal,

        mayaTotal,

        transactionTypes

    };

}


function formatReportDate(dateString){

    const parts =
        String(
            dateString
        ).split("-");

    if(parts.length !== 3){

        return dateString;

    }

    const date =
        new Date(
            Number(parts[0]),
            Number(parts[1]) - 1,
            Number(parts[2])
        );

    return date.toLocaleDateString(
        "en-PH",
        {
            year:"numeric",
            month:"long",
            day:"numeric"
        }
    );

}

window.generateDailySalesReport =
    async function(){

        const dateInput =
            document.getElementById(
                "dailyReportDate"
            );

        const status =
            document.getElementById(
                "dailyReportStatus"
            );

        const button =
            document.getElementById(
                "generateReportButton"
            );


        const dateString =
            dateInput.value;


        if(!dateString){

            status.textContent =
                "Please select a business date.";

            status.style.color =
                "#b42318";

            return;

        }


        if(!currentBusinessId){

            status.textContent =
                "Business information is missing.";

            status.style.color =
                "#b42318";

            return;

        }


        button.disabled =
            true;

        button.textContent =
            "Checking report...";

        status.textContent = "";


        try{

            /*
             * Each business gets its own report.
             *
             * Example:
             * users/BUSINESS_ID/dailySalesReports/2026-10-07
             */

            const reportRef =
                doc(
                    db,
                    "users",
                    currentBusinessId,
                    "dailySalesReports",
                    dateString
                );


            /*
             * Check if a report already exists.
             */

            const existingReport =
                await getDoc(
                    reportRef
                );


            if(
                existingReport.exists()
            ){

                const existingData =
                    existingReport.data();


                closeDailyReportGenerator();

                openDailyReportView(
                    existingData
                );

                return;

            }


            const reportSales =
                getSalesForBusinessDate(
                    dateString
                );


            if(!reportSales.length){

                status.textContent =
                    "There are no sales recorded for this business date.";

                status.style.color =
                    "#b42318";

                button.disabled =
                    false;

                button.textContent =
                    "Generate Daily Report";

                return;

            }


            const totals =
                getReportTotals(
                    reportSales
                );


            const generatedByName =
                currentUserData?.name ||
                currentUserData?.fullName ||
                currentUser.displayName ||
                "Unknown";


            const generatedByRole =
                currentRole === "staff"
                    ? "staff"
                    : "owner";


            const generatedAt =
                new Date();


            /*
             * Save a FINALIZED snapshot.
             *
             * The original sales remain unchanged.
             */

            const reportData = {

                businessId:
                    currentBusinessId,

                reportDate:
                    dateString,

                status:
                    "finalized",

                totalSales:
                    totals.totalSales,

                transactionCount:
                    totals.transactionCount,

                totalItems:
                    totals.totalItems,

                cashTotal:
                    totals.cashTotal,

                creditTotal:
                    totals.creditTotal,

                qrTotal:
                    totals.qrTotal,

                gcashTotal:
                    totals.gcashTotal,

                mayaTotal:
                    totals.mayaTotal,

                transactionTypes:
                    totals.transactionTypes,

                generatedByUid:
                    currentUser.uid,

                generatedByName:
                    generatedByName,

                generatedByRole:
                    generatedByRole,

                generatedAt:
                    serverTimestamp(),

                createdAt:
                    serverTimestamp(),

                /*
                 * Store the sale IDs included
                 * in this finalized report.
                 */
                saleIds:
                    reportSales.map(
                        sale =>
                            sale.id
                    )

            };


            await setDoc(
                reportRef,
                reportData
            );


            /*
             * We now have the official report.
             *
             * Use the local generated time for
             * immediate display.
             */

            reportData.generatedAt =
                generatedAt;


            reportData.createdAt =
                generatedAt;


            closeDailyReportGenerator();

            openDailyReportView(
                reportData
            );


        }catch(error){

            console.error(
                "Daily report error:",
                error
            );


            status.textContent =
                error.message ||
                "Unable to generate daily report.";

            status.style.color =
                "#b42318";


        }finally{

            button.disabled =
                false;

            button.textContent =
                "Generate Daily Report";

        }

    };

function renderReportSales(report){

    const saleIds =
        Array.isArray(
            report.saleIds
        )
        ? report.saleIds
        : [];


    const includedSales =
        sales.filter(
            sale =>
                saleIds.includes(
                    sale.id
                )
        )
        .sort(
            function(a,b){

                const timeA =
                    getDateValue(
                        a.createdAt
                    )?.getTime() || 0;

                const timeB =
                    getDateValue(
                        b.createdAt
                    )?.getTime() || 0;

                return timeA - timeB;

            }
        );


    if(!includedSales.length){

        return `
            <div class="report-generated">
                Sale details are not currently available.
            </div>
        `;

    }


    return includedSales
        .map(
            function(sale){

                const transaction =
                    getTransactionNumber(
                        sale
                    );


                const type =
                    getTransactionTypeLabel(
                        sale.transactionType
                    );


                const payment =
                    getPaymentLabel(
                        sale
                    );


                return `

                    <div class="report-sale">

                        <div class="report-sale-top">

                            <div class="report-sale-number">
                                ${escapeHTML(
                                    transaction
                                )}
                            </div>

                            <div class="report-sale-total">
                                ${peso(
                                    sale.total
                                )}
                            </div>

                        </div>

                        <div class="report-sale-bottom">

                            ${escapeHTML(
                                type
                            )}

                            ·

                            ${escapeHTML(
                                payment
                            )}

                            ·

                            ${escapeHTML(
                                getCashierName(
                                    sale
                                )
                            )}

                        </div>

                    </div>

                `;

            }
        )
        .join("");

}
