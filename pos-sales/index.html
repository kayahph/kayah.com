<title>Kayah POS Sales</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;

        Inter,

/* =====================================================
   HEADER
===================================================== */

.back-btn{

}

.header-logo-wrap{

.header-logo{

.business-placeholder{

.header-business{

.header-business-name{

.role-badge{

        9px;

    background:rgba(255,255,255,.15);

}

/* =====================================================
   PAGE
===================================================== */

.page{
    max-width:900px;
    margin:auto;
    padding:16px;
}

/* =====================================================
   TODAY SUMMARY
===================================================== */

.today-card{
    background:
        linear-gradient(
            135deg,
            #0B4F3A,
            #16805C
        );
    color:white;
    border-radius:20px;
    padding:20px;

.today-label{

}

.today-date{

}

.today-main{

    justify-content:space-between;
    gap:15px;
    margin-top:8px;
}

.today-total{
    font-size:31px;
    font-weight:900;
    line-height:1;
}

.today-count{
    text-align:right;
}

.today-count strong{
    display:block;
    font-size:23px;
}

.today-count span{

    opacity:.75;
}

.today-bottom{

    gap:10px;
    margin-top:17px;
}

.today-stat{
    flex:1;
    background:rgba(255,255,255,.11);
    border-radius:12px;
    padding:10px;
}

.today-stat-label{
    display:block;
    font-size:10px;
    opacity:.72;
}

.today-stat strong{

    margin-top:3px;

/* =====================================================
   SEARCH
===================================================== */

.search-wrap{
    position:relative;
    margin-bottom:15px;
}

.search-icon{
    position:absolute;
    left:13px;
    top:50%;

    font-size:15px;
}

.search-input{
    width:100%;
    height:45px;
    border:1px solid #dce5df;
    border-radius:13px;
    background:white;

        14px

    font-size:14px;
}

.search-input:focus{

/* =====================================================

===================================================== */

.sales-count{

/* =====================================================

}

.payment-badge{

.sale-bottom{

}

.sale-items-count{

.empty-title{

/* =====================================================

===================================================== */

.invoice-overlay{

.invoice-overlay.show{

}

}

@keyframes invoiceUp{

}

.invoice-actions{

.close-invoice{

.info-label{

.invoice-items{

.invoice-item{

.invoice-item-name{

.invoice-item-total{

.payment-card{

/* =====================================================

===================================================== */

.loading{
    padding:45px 20px;

    color:#7a857f;

.spinner{

/* =====================================================

@media(max-width:500px){

    }

    }

</style>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    query,
    orderBy,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
   DO NOT CHANGE
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyC_7nSwcfgoUXEEe2yo9TJw0cp7XiwGF6w",

    authDomain:
        "kayah-ecosystem.firebaseapp.com",

    projectId:
        "kayah-ecosystem",

    storageBucket:
        "kayah-ecosystem.firebasestorage.app",

    messagingSenderId:
        "49853785143",

    appId:
        "1:49853785143:web:23182e6e11696ac03dcbb2"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
    initializeApp(
        firebaseConfig
    );

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =====================================================
   CURRENT ACCOUNT
===================================================== */

let currentUser = null;

let currentUserData = null;

let currentRole = "owner";

let currentBusinessId = null;

let businessData = null;

let sales = [];


/* =====================================================
   HELPERS
===================================================== */

function peso(value){

    const amount =
        Number(value || 0);

    return "₱" +
        amount.toLocaleString(
            "en-PH",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


function getDateValue(createdAt){

    if(!createdAt){
        return null;
    }

    if(
        typeof createdAt.toDate ===
        "function"
    ){
        return createdAt.toDate();
    }

    if(
        createdAt instanceof Date
    ){
        return createdAt;
    }

    if(
        typeof createdAt === "number"
    ){
        return new Date(createdAt);
    }

    if(
        typeof createdAt === "string"
    ){

        const date =
            new Date(createdAt);

        if(
            !isNaN(
                date.getTime()
            )
        ){
            return date;
        }

    }

    return null;

}


function formatDateTime(createdAt){

    const date =
        getDateValue(createdAt);

    if(!date){
        return "Date unavailable";
    }

    return date.toLocaleString(
        "en-PH",
        {
            year:"numeric",
            month:"short",
            day:"numeric",
            hour:"numeric",
            minute:"2-digit"
        }
    );

}


function formatInvoiceDate(createdAt){

    const date =
        getDateValue(createdAt);

    if(!date){
        return "Date unavailable";
    }

    return date.toLocaleString(
        "en-PH",
        {
            year:"numeric",
            month:"short",
            day:"numeric",
            hour:"numeric",
            minute:"2-digit",
            second:"2-digit"
        }
    );

}


function isToday(createdAt){

    const date =
        getDateValue(createdAt);

    if(!date){
        return false;
    }

    const now =
        new Date();

    return (
        date.getFullYear() ===
            now.getFullYear()
        &&
        date.getMonth() ===
            now.getMonth()
        &&
        date.getDate() ===
            now.getDate()
    );

}


function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function getPaymentLabel(sale){

    if(
        sale.paymentMethod
    ){

        return String(
            sale.paymentMethod
        )
        .replace(
            /_/g,
            " "
        )
        .replace(
            /\b\w/g,
            c =>
                c.toUpperCase()
        );

    }

    return "Payment";

}


function getCashierName(sale){

    return (
        sale.performedByName ||
        sale.cashierName ||
        sale.staffName ||
        "Unknown"
    );

}


function getRoleLabel(sale){

    const role =
        String(
            sale.performedByRole ||
            sale.role ||
            "owner"
        )
        .toLowerCase();

    return role === "staff"
        ? "STAFF"
        : "OWNER";

}


/* =====================================================
   BUSINESS NAME
===================================================== */

function getBusinessName(){

    return (
        businessData?.businessName ||
        businessData?.name ||
        currentUserData?.businessName ||
        "Business"
    );

}


/* =====================================================
   BUSINESS LOGO
===================================================== */

function getBusinessLogo(){

    if(!businessData){
        return "";
    }

    return (
        businessData.logo ||
        businessData.businessLogo ||
        businessData.logoUrl ||
        businessData.image ||
        businessData.imageUrl ||
        ""
    );

}


/* =====================================================
   TRANSACTION NUMBER
=====================================================

   IMPORTANT:
   This is DISPLAY ONLY.

   sale.id remains the real Firebase
   document ID and is never changed.
===================================================== */

function getTransactionNumber(sale){

    const date =
        getDateValue(
            sale.createdAt
        );

    if(!date){

        return (
            "TXN-UNKNOWN-" +
            String(sale.id)
                .slice(0,6)
                .toUpperCase()
        );

    }

    const datePart =
        date.getFullYear()
            .toString() +

        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        ) +

        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );


    /*
       Build the daily sequence from
       the sales already loaded from Firebase.
    */

    const sameDaySales =
        sales
        .filter(
            function(item){

                const itemDate =
                    getDateValue(
                        item.createdAt
                    );

                if(!itemDate){
                    return false;
                }

                return (
                    itemDate.getFullYear() ===
                        date.getFullYear()
                    &&
                    itemDate.getMonth() ===
                        date.getMonth()
                    &&
                    itemDate.getDate() ===
                        date.getDate()
                );

            }
        )
        .sort(
            function(a,b){

                const timeA =
                    getDateValue(
                        a.createdAt
                    )?.getTime() || 0;

                const timeB =
                    getDateValue(
                        b.createdAt
                    )?.getTime() || 0;

                /*
                   Firebase document ID is only
                   used as a deterministic tie-breaker.
                   It is NOT changed.
                */

                return (
                    timeA - timeB
                ) ||
                String(a.id)
                    .localeCompare(
                        String(b.id)
                    );

            }
        );


    const index =
        sameDaySales.findIndex(
            function(item){
                return item.id === sale.id;
            }
        );


    const sequence =
        String(
            index >= 0
                ? index + 1
                : 1
        )
        .padStart(
            3,
            "0"
        );


    return (
        "TXN-" +
        datePart +
        "-" +
        sequence
    );

}

/* =====================================================
   LOAD CURRENT USER
===================================================== */

async function loadCurrentUser(){

    if(!currentUser){

        throw new Error(
            "User is not signed in."
        );

    }


    const ownUserRef =
        doc(
            db,
            "users",
            currentUser.uid
        );


    const ownUserSnap =
        await getDoc(
            ownUserRef
        );


    if(
        !ownUserSnap.exists()
    ){

        throw new Error(
            "User account was not found."
        );

    }


    currentUserData =
        ownUserSnap.data();


    currentRole =
        currentUserData.role ||
        "owner";


    if(
        currentRole === "staff"
    ){

        currentBusinessId =
            currentUserData.ownerUid;

    }else{

        currentBusinessId =
            currentUser.uid;

    }


    if(!currentBusinessId){

        throw new Error(
            "Business information is missing."
        );

    }

}

   LOAD BUSINESS
===================================================== */

    const businessRef =
        doc(

            "users",
            currentBusinessId
        );


    const businessSnap =

        );


    if(

    ){

    }else{

}


/* =====================================================
   LOAD SALES
===================================================== */

async function loadSales(){

    sales = [];


    const salesRef =
        collection(
            db,
            "users",
            currentBusinessId,
            "sales"
        );


    let snapshot;


    try{

        snapshot =
            await getDocs(
                query(
                    salesRef,
                    orderBy(
                        "createdAt",
                        "desc"
                    )
                )
            );

    }catch(error){

        /*
           Keep the existing fallback.
           This prevents the page from failing if
           an index is unavailable.
        */

        console.warn(
            "Ordered sales query failed. Using fallback.",
            error
        );

        snapshot =
            await getDocs(
                salesRef
            );

    }


    snapshot.forEach(
        saleDoc => {

            sales.push({

                id:
                    saleDoc.id,

                ...saleDoc.data()

            });

        }
    );


    sales.sort(
        function(a,b){

            const timeA =
                getDateValue(
                    a.createdAt
                )?.getTime() || 0;

            const timeB =
                getDateValue(
                    b.createdAt
                )?.getTime() || 0;

            return (
                timeB - timeA
            );

        }
    );


    updateTodaySummary();

    renderSales();

}


/* =====================================================
   TODAY SUMMARY
===================================================== */

function updateTodaySummary(){

    const todaySales =
        sales.filter(
            sale =>
                isToday(
                    sale.createdAt
                )
        );


    const total =
        todaySales.reduce(
            function(sum,sale){

                return sum +
                    Number(
                        sale.total || 0
                    );

            },
            0
        );


    const items =
        todaySales.reduce(
            function(sum,sale){

                const saleItems =
                    Array.isArray(
                        sale.items
                    )
                    ? sale.items
                    : [];


                return sum +
                    saleItems.reduce(
                        function(itemSum,item){

                            return itemSum +
                                Number(
                                    item.quantity || 0
                                );

                        },
                        0
                    );

            },
            0
        );


    const average =
        todaySales.length
            ? total / todaySales.length
            : 0;


    const now =
        new Date();


    document.getElementById(
        "todayDate"
    ).textContent =
        now.toLocaleDateString(
            "en-PH",
            {
                year:"numeric",
                month:"long",
                day:"numeric"
            }
        );


    document.getElementById(
        "todayTotal"
    ).textContent =
        peso(total);


    document.getElementById(
        "todayTransactions"
    ).textContent =
        todaySales.length;


    document.getElementById(
        "todayItems"
    ).textContent =
        items;


    document.getElementById(
        "todayAverage"
    ).textContent =
        peso(average);

}


/* =====================================================
   RENDER SALES
===================================================== */

function renderSales(){

    const list =
        document.getElementById(
            "salesList"
        );


    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    const filtered =
        sales.filter(
            function(sale){

                const transaction =
                    getTransactionNumber(
                        sale
                    )
                    .toLowerCase();

                const cashier =
                    getCashierName(
                        sale
                    )
                    .toLowerCase();

                const payment =
                    getPaymentLabel(
                        sale
                    )
                    .toLowerCase();


                return (
                    !search ||
                    transaction.includes(
                        search
                    ) ||
                    cashier.includes(
                        search
                    ) ||
                    payment.includes(
                        search
                    )
                );

            }
        );


    document.getElementById(
        "salesCount"
    ).textContent =
        filtered.length +
        (
            filtered.length === 1
                ? " sale"
                : " sales"
        );


    if(!filtered.length){

        list.innerHTML = `

            <div class="empty-box">

                <div class="empty-icon">
                    🧾
                </div>

                <div class="empty-title">
                    No sales found
                </div>

                <div class="empty-text">
                    ${
                        sales.length
                            ? "Try another search."
                            : "Sales will appear here after checkout."
                    }
                </div>

            </div>

        `;

        return;

    }


    list.innerHTML =
        filtered
        .map(
            function(sale){

                const transactionNumber =
                    getTransactionNumber(
                        sale
                    );


                const saleItems =
                    Array.isArray(
                        sale.items
                    )
                    ? sale.items
                    : [];


                const itemCount =
                    saleItems.reduce(
                        function(total,item){

                            return total +
                                Number(
                                    item.quantity || 0
                                );

                        },
                        0
                    );


                return `

                    <div
                        class="sale-card"
                        onclick="openInvoice('${escapeHTML(sale.id)}')"
                    >

                        <div class="sale-top">

                            <div class="sale-number">
                                ${escapeHTML(transactionNumber)}
                            </div>

                            <div class="sale-total">
                                ${peso(sale.total)}
                            </div>

                        </div>


                        <div class="sale-middle">

                            <div class="sale-date">
                                ${escapeHTML(
                                    formatDateTime(
                                        sale.createdAt
                                    )
                                )}
                            </div>

                            <div class="payment-badge">
                                ${escapeHTML(
                                    getPaymentLabel(
                                        sale
                                    )
                                )}
                            </div>

                        </div>


                        <div class="sale-bottom">

                            <div class="sale-cashier">

                                Cashier:
                                <strong>
                                    ${escapeHTML(
                                        getCashierName(
                                            sale
                                        )
                                    )}
                                </strong>

                                ·

                                <span class="role-small">
                                    ${escapeHTML(
                                        getRoleLabel(
                                            sale
                                        )
                                    )}
                                </span>

                            </div>

                            <div class="sale-items-count">

                                ${itemCount}
                                ${
                                    itemCount === 1
                                        ? "item"
                                        : "items"
                                }

                            </div>

                        </div>

                    </div>

                `;

            }
        )
        .join("");

}


/* =====================================================
   OPEN INVOICE
===================================================== */

window.openInvoice =
    function(saleId){

        const sale =
            sales.find(
                item =>
                    item.id === saleId
            );


        if(!sale){
            return;
        }


        const businessName =
            getBusinessName();


        const businessLogo =
            getBusinessLogo();


        const transactionNumber =
            getTransactionNumber(
                sale
            );


        const cashier =
            getCashierName(
                sale
            );


        const role =
            getRoleLabel(
                sale
            );


        const payment =
            getPaymentLabel(
                sale
            );


        const items =
            Array.isArray(
                sale.items
            )
            ? sale.items
            : [];


        const subtotal =
            items.reduce(
                function(total,item){

                    const itemSubtotal =
                        Number(
                            item.subtotal ??
                            (
                                Number(
                                    item.price || 0
                                ) *
                                Number(
                                    item.quantity || 0
                                )
                            )
                        );


                    return total +
                        itemSubtotal;

                },
                0
            );


        const total =
            Number(
                sale.total || subtotal
            );


        let logoHTML = `

            <div class="invoice-logo-placeholder">
                K
            </div>

        `;


        if(businessLogo){

            logoHTML = `

                <img
                    class="invoice-logo"
                    src="${escapeHTML(
                        businessLogo
                    )}"
                    style="display:block;"
                    alt="Business logo"
                >

            `;

        }


        let paymentDetails = `

            <div class="payment-row">

                <span>
                    Payment Method
                </span>

                <strong>
                    ${escapeHTML(
                        payment
                    )}
                </strong>

            </div>

        `;


        if(
            String(
                sale.paymentMethod || ""
            ).toLowerCase() === "cash"
        ){

            paymentDetails += `

                <div class="payment-row">

                    <span>
                        Cash Received
                    </span>

                    <strong>
                        ${peso(
                            sale.cashReceived
                        )}
                    </strong>

                </div>

                <div class="payment-row">

                    <span>
                        Change
                    </span>

                    <strong>
                        ${peso(
                            sale.change
                        )}
                    </strong>

                </div>

            `;

        }


        if(sale.qrMethod){

            paymentDetails += `

                <div class="payment-row">

                    <span>
                        QR Method
                    </span>

                    <strong>
                        ${escapeHTML(
                            sale.qrMethod
                        )}
                    </strong>

                </div>

            `;

        }


        if(sale.creditNote){

            paymentDetails += `

                <div class="payment-row">

                    <span>
                        Credit Note
                    </span>

                    <strong>
                        ${escapeHTML(
                            sale.creditNote
                        )}
                    </strong>

                </div>

            `;

        }


        const itemHTML =
            items.length
            ? items
                .map(
                    function(item){

                        const price =
                            Number(
                                item.price || 0
                            );

                        const quantity =
                            Number(
                                item.quantity || 0
                            );

                        const itemTotal =
                            Number(
                                item.subtotal ??
                                (
                                    price *
                                    quantity
                                )
                            );


                        return `

                            <div class="invoice-item">

                                <div class="invoice-item-name">
                                    ${escapeHTML(
                                        item.name ||
                                        "Product"
                                    )}
                                </div>

                                <div class="invoice-item-qty">
                                    ${quantity}
                                </div>

                                <div class="invoice-item-price">
                                    ${peso(price)}
                                </div>

                                <div class="invoice-item-total">
                                    ${peso(itemTotal)}
                                </div>

                            </div>

                        `;

                    }
                )
                .join("")
            : `

                <div class="empty-text">
                    No item details available.
                </div>

            `;


        document.getElementById(
            "invoiceContent"
        ).innerHTML = `

            <div class="invoice">

                <div class="invoice-header">

                    <div class="invoice-brand">

                        <div class="invoice-logo-wrap">

                            ${logoHTML}

                        </div>

                        <div>

                            <div class="invoice-business-name">

                                ${escapeHTML(
                                    businessName
                                )}

                            </div>

                            <div class="invoice-business-subtitle">

                                Kayah Point of Sale

                            </div>

                        </div>

                    </div>


                    <div class="invoice-title-row">

                        <div class="invoice-title">
                            SALES INVOICE
                        </div>

                        <div class="invoice-number">

                            ${escapeHTML(
                                transactionNumber
                            )}

                        </div>

                    </div>

                </div>


                <div class="invoice-body">

                    <div class="invoice-info">

                        <div class="info-box">

                            <span class="info-label">
                                Date & Time
                            </span>

                            <span class="info-value">
                                ${escapeHTML(
                                    formatInvoiceDate(
                                        sale.createdAt
                                    )
                                )}
                            </span>

                        </div>


                        <div class="info-box">

                            <span class="info-label">
                                Cashier
                            </span>

                            <span class="info-value">
                                ${escapeHTML(
                                    cashier
                                )}
                            </span>

                        </div>


                        <div class="info-box">

                            <span class="info-label">
                                Account Role
                            </span>

                            <span class="info-value">
                                ${escapeHTML(

                                )}

                        </div>


                        <div class="info-box">

                            <span class="info-label">
                                Transaction
                            </span>

                            <span class="info-value">
                                ${escapeHTML(
                                    transactionNumber
                                )}
                            </span>

                        </div>

                    </div>


                    <div class="invoice-section-title">
                        Items
                    </div>


                    <div class="invoice-items">

                        <div
                            class="invoice-item"
                            style="
                                background:#f7f9f8;
                                border-radius:8px;
                                border:0;
                                padding:8px;
                            "
                        >

                            <div
                                class="invoice-item-name"

                            </div>

                            <div
                                class="invoice-item-qty"

                            <strong>
                                ${peso(subtotal)}
                            </strong>

                        </div>


                        <div class="summary-row total">

                            <span>
                                TOTAL
                            </span>

                            <strong class="invoice-total">
                                ${peso(total)}
                            </strong>

                        </div>

        `;


        document.getElementById(
            "invoiceOverlay"
        ).classList.add(
            "show"
        );

    };

/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){

            window.location.href =
                "../login/";

            return;

        }


        currentUser =
            user;


        try{

            await loadCurrentUser();

            await loadBusiness();

            await loadSales();


        }catch(error){

            console.error(
                "Sales page error:",
                error
            );


            document.getElementById(
                "salesList"
            ).innerHTML = `

                <div class="empty-box">

                    <div class="empty-icon">
                        ⚠️
                    </div>

                    <div class="empty-title">
                        Unable to load sales
                    </div>

                    <div class="empty-text">
                        ${escapeHTML(
                            error.message ||
                            "Please try again."
                        )}
                    </div>

                </div>

            `;

        }

    }
);
